<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Pocket Scan: a page inside the camera's four corners, crossed by the yellow scan line of the app's shutter. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3563E6"/>
      <stop offset="1" stop-color="#2447B8"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 58 V30 H58"/>
    <path d="M134 30 H162 V58"/>
    <path d="M162 134 V162 H134"/>
    <path d="M58 162 H30 V134"/>
  </g>
  <rect x="58" y="50" width="76" height="100" rx="6" fill="#000" fill-opacity="0.2"/>
  <rect x="58" y="44" width="76" height="100" rx="6" fill="#FFFFFF"/>
  <g fill="#C3CCD8">
    <rect x="70" y="60" width="44" height="7" rx="3.5"/>
    <rect x="70" y="76" width="52" height="7" rx="3.5"/>
    <rect x="70" y="112" width="48" height="7" rx="3.5"/>
    <rect x="70" y="128" width="32" height="7" rx="3.5"/>
  </g>
  <rect x="44" y="92" width="104" height="12" rx="6" fill="#FFCF2A"/>
</svg>
