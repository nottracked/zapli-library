      "purpose": "@widgetPurpose"

  "entities": {
    "card": {
      "label": "@card",

          "store",
          "number"
        ]
      ],
      "sort": [
        "-pinned",
        "-uses",
        "store"
      ],
      "display": {
        "title": "=item.store",
        "subtitle": "=item.expired ? t('expiredLine', {'date': formatDate(item.expires, 'yMMMd')}) : t('endsIn', {'digits': substring(item.number, max(size(item.number) - 4, 0))})",
        "trailing": "=has(item.points) ? formatNumber(item.points) : ''",
        "icon": "=coalesce(optionIcon(item.group), 'storefront')",
        "tone": "=item.expired ? 'warning' : null"
      },
      "fields": {
        "store": {
          "type": "text",
          "label": "@store",
          "required": true,
          "maxLength": 60,
          "kind": "name"

        "number": {
          "type": "barcode",
          "label": "@cardNumber",
          "required": true,
          "kind": "loyaltyCard",
          "sensitivity": "personal",
          "checks": [
            {
              "condition": "=size(item.number) <= 300",
              "message": "@thatIsTooLong"
            },
            {
              "condition": "=item.format != 'ean13' || item.number.matches(r'^[0-9]{12,13}$')",
              "message": "@ean13Needs12"
            },
            {
              "condition": "=item.format != 'ean13' || !item.number.matches(r'^[0-9]{13}$') || checkDigitValid(item.number, 'ean13')",
              "message": "@lastDigitThisEan"
            },
            {
              "condition": "=item.format != 'ean8' || item.number.matches(r'^[0-9]{7,8}$')",
              "message": "@ean8Needs7"
            },
            {
              "condition": "=item.format != 'ean8' || !item.number.matches(r'^[0-9]{8}$') || checkDigitValid(item.number, 'ean8')",
              "message": "@lastDigitThisEan2"
            },
            {
              "condition": "=item.format != 'upcA' || item.number.matches(r'^[0-9]{11,12}$')",
              "message": "@upcNeeds1112"
            },
            {
              "condition": "=item.format != 'upcA' || !item.number.matches(r'^[0-9]{12}$') || checkDigitValid(item.number, 'upcA')",
              "message": "@lastDigitThisUpc"
            },
            {
              "condition": "=item.format != 'upcE' || item.number.matches(r'^([0-9]{6}|[01][0-9]{6,7})$')",
              "message": "@upcENeeds6"
            },
            {
              "condition": "=item.format != 'upcE' || !item.number.matches(r'^[01][0-9]{7}$') || checkDigitValid(item.number, 'upcE')",
              "message": "@lastDigitThisUpc2"
            },
            {
              "condition": "=item.format != 'code39' || item.number.matches(r'^[0-9A-Z .$/+%-]+$')",
              "message": "@code39TakesCapital"
            },
            {
              "condition": "=item.format != 'code128' || item.number.matches(r'^[ -~]+$')",
              "message": "@code128TakesPlain"
            },
            {
              "condition": "=item.format != 'code93' || item.number.matches(r'^[ -~]+$')",
              "message": "@code93TakesPlain"
            },
            {
              "condition": "=item.format != 'codabar' || item.number.matches(r'^([A-D][0-9$:/.+-]{2,}[A-D]|[0-9$:/.+-]{2,})$')",
              "message": "@codabarTakesDigitsWith"
            },
            {
              "condition": "=item.format != 'itf' || item.number.matches(r'^([0-9][0-9]){3,}$')",
              "message": "@itfNeedsEvenNumber"
            }

            },
            {
              "value": "aztec",

              "icon": "qr_code"
            },
            {
              "value": "codabar",
              "label": "Codabar",
              "icon": "barcode"
            },
            {
              "value": "code93",

              "icon": "barcode"

        "group": {

            {
              "value": "storefront",

              "icon": "storefront",
              "hue": "indigo"
            },
            {
              "value": "shopping_bag",
              "label": "@clothesShoes",
              "icon": "shopping_bag",

            },
            {
              "value": "medication",

            },
            {
              "value": "spa",
              "label": "@beauty",
              "icon": "spa",
              "hue": "pink"
            },
            {

            {
              "value": "handyman",

            {

            {

            {

            {

              "hue": "brown"
            },
            {
              "value": "flight",

              "icon": "flight",
              "hue": "cyan"
            },
            {

              "value": "pets",

              "icon": "sell",
              "hue": "violet"
            }
          ]
        },
        "points": {
          "type": "number",
          "label": "@pointsBalance",
          "min": 0
        },
        "expires": {
          "type": "date",
          "label": "@validUntil"
        },
        "note": {
          "type": "longText",
          "label": "@note",
          "maxLength": 500
        },
        "color": {
          "type": "color",
          "label": "@colour"
        },
        "picture": {
          "type": "image",
          "label": "@pictureCard"
        },
        "pinned": {
          "type": "boolean",
          "label": "@favourite",
          "default": false
        },
        "archived": {
          "type": "boolean",
          "label": "@archived",
          "default": false
        },
        "uses": {
          "type": "integer",
          "label": "@timesShown2",
          "default": 0,
          "min": 0,
          "merge": "counter",
          "editable": false
        },
        "lastUsed": {
          "type": "datetime",
          "label": "@lastShown",
          "editable": false
        },
        "brand": {
          "type": "text",
          "label": "@storeId",
          "maxLength": 40
        },
        "remind": {
          "type": "boolean",
          "label": "@remind",
          "default": true
        },
        "expired": {
          "type": "boolean",
          "label": "@expired",
          "compute": "=has(item.expires) && item.expires < today()"
        }

    "importLog": {
      "label": "@importLog",
      "labelPlural": "@importLogs",
      "sort": [
        "-at"
      ],
      "display": {

      },
      "fields": {
        "at": {
          "type": "datetime",

          "required": true

          "type": "integer",

        "duplicates": {
          "type": "integer",
          "label": "@duplicates",
          "default": 0
        },
        "skipped": {
          "type": "integer",
          "label": "@skippedRows",
          "default": 0
        },

          "type": "longText",
          "label": "@problems",
          "maxLength": 5000
        }
      }
    }
  },
  "queries": {
    "top": {
      "entity": "card",
      "where": "=!item.archived",
      "sort": [
        "-pinned",
        "-uses",
        "-lastUsed",
        "store"
      ],
      "limit": 5
    },
    "allCards": {
      "entity": "card",
      "sort": [
        "store"
      ],
      "limit": 2000
    }
  },
  "actions": {
    "screenOn": {
      "args": {
        "on": {
          "type": "boolean",
          "required": true
        }
      },
      "steps": [
        {
          "type": "capability",
          "capability": "device.ux",
          "action": "keepScreenOn",
          "args": {
            "enabled": "=args.on"
          },
          "onError": "continue"
        },
        {
          "type": "capability",
          "capability": "device.ux",
          "action": "maxBrightness",
          "args": {
            "enabled": "=args.on"
          }
        }
      ]
    },
    "showCode": {
      "args": {
        "card": {
          "type": "ref",
          "to": "card",
          "required": true
        },
        "format": {
          "type": "text",
          "required": true
        }
      },
      "steps": [
        {
          "type": "capability",
          "capability": "barcode.render",
          "action": "show",
          "args": {
            "value": "=args.card.number",
            "format": "=args.format",
            "title": "=args.card.store"
          },
          "onError": "continue",
          "errorAs": "showError"
        },
        {
          "type": "toast",
          "when": "=vars.showError != null && vars.showError.code != 'CANCELLED'",
          "text": "=coalesce(vars.showError.message, '')"
        }
      ]
    },
    "markUsed": {
      "args": {
        "card": {
          "type": "ref",
          "to": "card",
          "required": true
        }
      },
      "steps": [
        {
          "type": "updateRecord",
          "record": "=args.card",
          "increment": {
            "uses": 1
          },
          "set": {
            "lastUsed": "=now()"
          }
        }
      ]
    },
    "exportCards": {
      "steps": [
        {
          "type": "capability",
          "capability": "files.io",
          "action": "exportCsv",
          "args": {
            "query": "allCards",
            "fileName": "='cards-' + string(today()) + '.csv'",
            "columns": [
              "store",
              "number",
              "format",
              "holder",
              "group",
              "points",
              "expires",
              "note",
              "pinned",
              "archived",
              "brand",
              "remind"
            ]
          },
          "as": "saved"
        },
        {
          "type": "toast",
          "when": "=vars.saved.saved",
          "text": "=t('exported', {'n': coalesce(vars.saved.rows, 0)})"
        }
      ]
    },
    "importCards": {
      "steps": [
        {
          "type": "capability",
          "capability": "files.io",
          "action": "importCsv",
          "args": {
            "entity": "card",
            "fields": {
              "store": {
                "from": [
                  "Store",
                  "Shop",
                  "Merchant",
                  "Store name",
                  "Retailer",
                  "Obchod"
                ]
              },
              "number": {
                "from": [
                  "barcodeid",
                  "cardid",
                  "Card number",
                  "Card ID",
                  "Number",
                  "Member number",
                  "Membership number",
                  "Code",
                  "Barcode",
                  "Číslo karty"
                ]
              },
              "format": {
                "from": [
                  "Barcode type",
                  "Barcode format",
                  "Format",
                  "Typ čiarového kódu"
                ],
                "values": {
                  "*": "auto",
                  "Automatic": "auto",
                  "Automaticky": "auto",
                  "QR code": "qr",
                  "QR kód": "qr",
                  "ITF (Interleaved 2 of 5)": "itf"
                }
              },
              "holder": {
                "from": [
                  "Name on the card",
                  "Card holder",
                  "Holder",
                  "Meno na karte"
                ]
              },
              "group": {
                "values": {
                  "Groceries": "shopping_cart",
                  "Potraviny": "shopping_cart",
                  "Shop": "storefront",
                  "Obchod": "storefront",
                  "Clothes and shoes": "shopping_bag",
                  "Oblečenie a obuv": "shopping_bag",
                  "Pharmacy": "medication",
                  "Lekáreň": "medication",
                  "Beauty": "spa",
                  "Kozmetika": "spa",
                  "Fuel and car": "directions_car",
                  "Palivo a auto": "directions_car",
                  "Home and DIY": "handyman",
                  "Domácnosť a hobby": "handyman",
                  "Electronics": "keyboard",
                  "Elektronika": "keyboard",
                  "Books": "menu_book",
                  "Knihy": "menu_book",
                  "Food and drink": "restaurant",
                  "Jedlo a nápoje": "restaurant",
                  "Coffee": "local_cafe",
                  "Káva": "local_cafe",
                  "Travel": "flight",
                  "Cestovanie": "flight",
                  "Sport and gym": "fitness_center",
                  "Šport a fitnes": "fitness_center",
                  "Zvieratá": "pets",
                  "Kids": "child_care",
                  "Deti": "child_care",
                  "Library": "book",
                  "Knižnica": "book",
                  "Membership": "badge",
                  "Členstvo": "badge",
                  "Voucher or gift card": "sell",
                  "Poukážka alebo darčeková karta": "sell",
                  "Kozmetika a drogéria": "spa",
                  "Pets": "pets"
                },
                "from": [
                  "Kind of shop",
                  "Group",
                  "Category",
                  "Druh obchodu"
                ]
              },
              "points": {
                "from": [
                  "Points or balance",
                  "Points",
                  "Balance",
                  "Body alebo zostatok"
                ]
              },
              "expires": {
                "from": [
                  "Valid until",
                  "Expiry date",
                  "Expiry",
                  "Expires",
                  "Platná do"
                ]
              },
              "note": {
                "from": [
                  "Note",
                  "Notes",
                  "Comment",
                  "Poznámka"
                ]
              },
              "pinned": {
                "from": [
                  "Favourite",
                  "Obľúbená",
                  "Pin to the top",
                  "Pripnúť navrch",
                  "starstatus",
                  "Favorite",
                  "Starred"
                ]
              },
              "archived": {
                "from": [
                  "Archived",
                  "archive",
                  "Archivovaná"
                ]
              },
              "lastUsed": {
                "from": [
                  "Last shown",
                  "lastused",
                  "Last used",
                  "Naposledy zobrazená"
                ],
                "values": {
                  "0": ""
                }
              },
              "brand": {
                "from": [
                  "Store in the list",
                  "Obchod v zozname",
                  "Brand"
                ]
              },
              "remind": {
                "from": [
                  "Remind me before it expires",
                  "Pripomenúť pred koncom platnosti"
                ]
              }
            },
            "onDuplicate": "skip",
            "key": [
              "store",
              "number"
            ],
            "onError": "skip"
          },
          "as": "imported"
        },
        {
          "type": "createRecord",
          "entity": "importLog",
          "values": {
            "at": "=now()",
            "added": "=vars.imported.added",
            "duplicates": "=vars.imported.duplicates",
            "skipped": "=vars.imported.skipped",
            "problems": "=join(take(vars.imported.problems, 8).map(p, t('problemLine', {'row': p.row, 'reason': p.reason})), '\\n') + (vars.imported.skipped > 8 ? '\\n' + t('moreProblems', {'n': vars.imported.skipped - 8}) : '')"
          }
        }
      ]
    },
    "remindExpiry": {
      "args": {
        "card": {
          "type": "ref",
          "to": "card"
        }
      },
      "steps": [
        {
          "type": "capability",
          "capability": "notify.local",
          "action": "show",
          "args": {
            "title": "=t('expiryTitle', {'store': args.card.store})",
            "body": "=t('expiryBody', {'date': formatDate(args.card.expires, 'yMMMd')})",

            },
            "tag": "='expiry-' + string(args.card.id)",

  },
  "triggers": {
    "expirySoon": {
      "type": "recordTime",
      "entity": "card",
      "at": "=has(item.expires) ? timestamp(string(addDays(item.expires, -7)) + 'T09:00') : null",
      "ifPast": "now",
      "when": "=coalesce(item.remind, true) && has(item.expires) && item.expires >= today() && !item.archived",
      "do": "remindExpiry",
      "args": {
        "card": "=item.id"
      },
      "maxPerDay": 3
    }
  },
  "widgets": {
    "topCards": {
      "template": "list",
      "title": "@favouriteCards",
      "sizes": [
        "medium",
        "large"
      ],
      "query": "top",
      "label": "=item.store",
      "caption": "=coalesce(item.holder, '') != '' ? coalesce(item.holder, '') : t('endsIn', {'digits': substring(item.number, max(size(item.number) - 4, 0))})",
      "icon": "=coalesce(optionIcon(item.group), 'storefront')",
      "open": "wallet"
    }
  }
}

        --accent: var(--zapli-color-primary, #b9a3ef);
        --on-accent: var(--zapli-color-on-primary, #231049);
    }
}

* {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

.word {
    white-space: nowrap;
}

/* Text for screen readers only: the name of a field or a toggle whose look says it without words. */
.unseen {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
}

html {
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.45 var(--zapli-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    padding: 0 var(--safe-right) 0 var(--safe-left);
    overflow-wrap: break-word;
}

main:focus {
    outline: none;
}

button,
input,
select,
textarea {
    font: inherit;
    color: inherit;
}

:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
}

.icon {
    width: 1.5rem;
    height: 1.5rem;
    flex: none;
}

.loading {
    padding: 3rem 1.25rem;
    text-align: center;
    color: var(--muted);
}

.screen {
    min-height: 100dvh;
    padding-bottom: calc(var(--safe-bottom) + 6.5rem);
}

/* ---------------------------------------------------------------- top bar */

.topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    min-height: 3.5rem;
    padding: calc(var(--safe-top) + 0.25rem) 0.5rem 0.25rem;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
}

.topbar-title {
    flex: 1;
    min-width: 0;
    margin: 0 0.5rem;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.topbar.large .topbar-title {
    font-size: 1.75rem;
    margin-left: 0.75rem;
    letter-spacing: -0.01em;
}

.topbar-actions {
    display: flex;
    align-items: center;
}

/* ---------------------------------------------------------------- buttons */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 3rem;
    padding: 0.5rem 1.25rem;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
}

.btn.filled {
    background: var(--accent);
    color: var(--on-accent);
}

.btn.filled.danger {
    background: var(--danger);
    color: #fff;
}

@media (prefers-color-scheme: dark) {
    .btn.filled.danger {
        color: #370b07;
    }
}

.btn.tonal {
    background: var(--tonal);
    color: var(--on-tonal);
}

.btn.text {
    background: transparent;
    color: var(--accent);
    padding: 0.5rem 0.875rem;
}

.btn.icon {
    width: 3rem;
    height: 3rem;
    min-height: 3rem;
    padding: 0;
    background: transparent;
    color: var(--text);
}

.btn.icon:active,
.btn.text:active {
    background: var(--surface-2);
}

.btn.wide {
    width: 100%;
    margin-top: 0.75rem;
}

.btn[disabled] {
    opacity: 0.5;
}

.star-toggle.on {
    color: #e8a000;
}

/* ---------------------------------------------------------------- search */

.search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.25rem 1rem 0.75rem;
    padding: 0 0.25rem 0 0.875rem;
    min-height: 3.25rem;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--muted);
}

.search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    font-size: 1.05rem;
    padding: 0.75rem 0;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
}

.search-input::-webkit-search-cancel-button {
    display: none;
}

.search:focus-within {
    box-shadow: inset 0 0 0 2px var(--accent);
}

/* ---------------------------------------------------------------- card faces */

.section-title {
    margin: 1.25rem 1rem 0.5rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.01em;
}

.faces {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr));
    gap: 0.75rem;
    padding: 0 1rem;
}

.big-text .faces {
    grid-template-columns: 1fr;
}

.face-button {
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 0;
    background: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
}

.face-button:active .face {
    transform: scale(0.98);
}

.face {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1.586;
    padding: 0.75rem 0.8rem 0.7rem;
    border-radius: var(--radius);
    overflow: hidden;
    color: var(--face-fg);
    background: var(--face-bg);
    background-image:
        radial-gradient(circle at 112% -20%, rgba(255, 255, 255, 0.22) 0 38%, transparent 38.5%),
        radial-gradient(circle at 105% 125%, rgba(0, 0, 0, 0.1) 0 30%, transparent 30.5%),
        linear-gradient(140deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.12));
    box-shadow:
        var(--shadow),
        inset 0 0 0 1px var(--face-line);
    transition: transform 0.12s ease;
}

.face.has-photo {
    color: #fff;
    background: #222;
}

.face-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.face.has-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 32%);
}

.face > *:not(.face-photo) {
    position: relative;
    z-index: 1;
}

.face-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 1.5rem;
}

.face-kind {
    display: inline-flex;
    opacity: 0.85;
}

.face-kind .icon,
.face-star .icon {
    width: 1.25rem;
    height: 1.25rem;
}

.face-star {
    display: inline-flex;
    color: inherit;
}

.face-marks {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
}

.face-label {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
}

.face-label-name {
    min-width: 0;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    background: rgba(10, 10, 16, 0.62);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.face-name-box {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    padding: 0.2rem 0;
}

.face-name {
    display: block;
    max-width: 100%;
    font-size: 1.4rem;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.015em;
    hyphens: manual;
}

.face-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
}

.face-digits {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    opacity: 0.9;
    white-space: nowrap;
}

.face-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.1rem 0.5rem 0.1rem 0.4rem;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.2);
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.face-chip .icon {
    width: 0.9rem;
    height: 0.9rem;
}

.face-chip.warn {
    background: #ffe1a6;
    color: #4a2c00;
}

.no-match {
    margin: 1.5rem 1rem;
    color: var(--muted);
}

/* ---------------------------------------------------------------- add button and snackbar */

.fab {
    position: fixed;
    right: calc(var(--safe-right) + 1rem);
    bottom: calc(var(--safe-bottom) + 1rem);
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 3.5rem;
    padding: 0 1.4rem 0 1.1rem;
    border: 0;
    border-radius: 1.1rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    font-size: 1rem;
    box-shadow:
        0 3px 6px rgba(20, 16, 40, 0.2),
        0 10px 24px rgba(20, 16, 40, 0.22);
    cursor: pointer;
}

.snackbar {
    position: fixed;
    left: calc(var(--safe-left) + 0.75rem);
    right: calc(var(--safe-right) + 0.75rem);
    bottom: calc(var(--safe-bottom) + 5.5rem);
    z-index: 20;
    display: none;
    align-items: center;
    gap: 0.5rem;
    min-height: 3rem;
    padding: 0.5rem 0.5rem 0.5rem 1rem;
    border-radius: 0.875rem;
    background: #2f2d38;
    color: #f4f2fb;
    box-shadow: var(--shadow);
    max-width: 36rem;
    margin: 0 auto;
}

.snackbar.on {
    display: flex;
}

.snack-text {
    flex: 1;
}

.snack-action {
    min-height: 3rem;
    padding: 0 0.875rem;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #cdbcff;
    font-weight: 700;
    cursor: pointer;
}

/* ---------------------------------------------------------------- empty states */

.empty {
    padding: 2rem 1.5rem;
    text-align: center;
}

.empty h2 {
    margin: 1rem 0 0.5rem;
    font-size: 1.4rem;
    line-height: 1.25;
}

.empty p {
    margin: 0 auto 1.5rem;
    max-width: 28rem;
    color: var(--muted);
}

.empty-art {
    width: min(70%, 15rem);
    height: auto;
    margin-top: 1rem;
}

.empty-actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
    max-width: 22rem;
    margin: 0 auto;
}

/* ---------------------------------------------------------------- the store list */

.quick {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0 1rem 0.5rem;
}

.quick .btn {
    flex: 1 1 8rem;
    flex-direction: column;
    gap: 0.3rem;
    min-height: 4.75rem;
    padding: 0.6rem 0.75rem;
    border-radius: 18px;
}

.scanned-banner {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0 1rem 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    background: var(--tonal);
    color: var(--on-tonal);
    font-weight: 600;
    word-break: break-all;
}

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0 1rem;
}

.chip {
    flex: none;
    min-height: 2.5rem;
    padding: 0.4rem 1rem;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    font-weight: 600;
    cursor: pointer;
}

.chip.on {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: none;
}

.tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 6.4rem), 1fr));
    gap: 0.625rem;
    padding: 0 1rem;
}

.big-text .tiles {
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 8.5rem), 1fr));
}

.tile {
    padding: 0;
    border: 0;
    background: none;
    border-radius: 12px;
    cursor: pointer;
}

.tile:active .tile-face {
    transform: scale(0.96);
}

.tile-face {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1.586;
    padding: 0.35rem 0.45rem;
    border-radius: 12px;
    overflow: hidden;
    color: var(--face-fg);
    background: var(--face-bg);
    background-image: linear-gradient(150deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.1));
    box-shadow:
        0 1px 2px rgba(20, 16, 40, 0.12),
        inset 0 0 0 1px var(--face-line);
    transition: transform 0.12s ease;
}

.tile-name {
    display: block;
    max-width: 100%;
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-align: center;
}

.other-face {
    flex-direction: column;
    gap: 0.15rem;
    background: var(--surface);
    background-image: none;
    color: var(--accent);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent);
    --face-line: transparent;
}

.other-face .tile-name {
    font-size: 0.9rem;
    font-weight: 700;
}

.show-all {
    display: flex;
    margin: 1rem auto 0;
}

.own-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: calc(100% - 2rem);
    margin: 1rem 1rem 0;
    min-height: 3.5rem;
    padding: 0.5rem 0.75rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    text-align: left;
    cursor: pointer;
}

.own-icon {
    display: inline-flex;
    padding: 0.4rem;
    border-radius: 999px;
    background: var(--tonal);
    color: var(--on-tonal);
}

.own-text {
    flex: 1;
    font-weight: 600;
}

/* ---------------------------------------------------------------- dialogs and sheets */

.dialog {
    width: min(32rem, calc(100vw - 2rem));
    max-height: calc(100dvh - 2rem - var(--safe-top) - var(--safe-bottom));
    padding: 0;
    border: 0;
    border-radius: 24px;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    overflow: hidden;
}

.dialog::backdrop {
    background: rgba(10, 8, 20, 0.48);
}

.dialog-body {
    max-height: inherit;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 1.25rem;
}

.dialog.sheet {
    width: min(40rem, 100vw);
    max-width: 100vw;
    margin: auto auto 0;
    border-radius: 24px 24px 0 0;
    max-height: calc(100dvh - var(--safe-top) - 1rem);
}

.dialog.sheet .dialog-body {
    padding-bottom: calc(1.25rem + var(--safe-bottom));
}

.dialog.full {
    width: 100vw;
    max-width: 100vw;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0;
    border-radius: 0;
}

.dialog.full .dialog-body {
    height: 100%;
    padding: calc(var(--safe-top) + 0.5rem) calc(var(--safe-right) + 0rem) calc(var(--safe-bottom) + 1.5rem)
        calc(var(--safe-left) + 0rem);
}

.dialog.full .sheet-head {
    padding: 0 0.5rem 0 1rem;
}

.ask-title {
    margin: 0 0 0.5rem;
    font-size: 1.3rem;
    line-height: 1.25;
}

.ask-body {
    margin: 0 0 1rem;
    color: var(--muted);
}

.ask-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
}

.problems {
    max-height: 14rem;
    overflow: auto;
    padding: 0.75rem;
    border-radius: 12px;
    background: var(--surface-2);
    font:
        0.85rem/1.4 ui-monospace,
        monospace;
    white-space: pre-wrap;
}

.menu {
    display: flex;
    flex-direction: column;
    margin: -0.5rem -0.75rem;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 3.5rem;
    padding: 0.5rem 1rem;
    border: 0;
    border-radius: 12px;
    background: none;
    text-align: left;
    font-weight: 500;
    cursor: pointer;
}

.menu-item:active {
    background: var(--surface-2);
}

.menu-item.danger {
    color: var(--danger);
}

.sheet-head {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
}

.sheet-face {
    width: 5.5rem;
    flex: none;
}

.sheet-title {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 1.3rem;
    line-height: 1.2;
}

.sheet-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
}

.sheet-actions .btn {
    flex: 1 1 10rem;
}

.queue-picture {
    display: block;
    max-width: calc(100% - 2rem);
    max-height: 34dvh;
    margin: 0 auto 0.5rem;
    border-radius: 12px;
    box-shadow: var(--shadow);
}

.queue-code {
    margin: 0.25rem 1rem;
    font-weight: 600;
    word-break: break-all;
}

.queue .field-hint {
    margin: 0 1rem 0.75rem;
}

.queue .search {
    margin-top: 0.5rem;
}

/* ---------------------------------------------------------------- form fields */

.form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 0.5rem 1rem 2rem;
    max-width: 40rem;
    margin: 0 auto;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.field-label {
    font-weight: 600;
    font-size: 0.95rem;
}

.store-sheet .field-label {
    display: block;
    margin-top: 0.75rem;
}

.label-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 0.5rem;
    margin-top: 0.5rem;
}

.label-row .field-label {
    margin-top: 0;
}

.field-input {
    width: 100%;
    min-height: 3.25rem;
    padding: 0.65rem 0.875rem;
    border: 0;
    border-radius: 12px;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);
    font-size: 1.05rem;
    outline: none;
}

.field-input:focus {
    box-shadow: inset 0 0 0 2px var(--accent);
}

textarea.field-input {
    resize: vertical;
    min-height: 5.5rem;
}

.number-input {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
}

.field-hint {
    margin: 0.35rem 0 0;
    font-size: 0.875rem;
    color: var(--muted);
}

.detected:empty,
.field-error:empty {
    display: none;
}

.detected {
    color: var(--on-tonal);
    font-weight: 600;
}

.field-error {
    margin: 0.5rem 0 0;
    color: var(--danger);
    font-weight: 600;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.input-row .field-input {
    flex: 1;
    min-width: 0;
}

.keyboard-toggle {
    min-height: 2.75rem;
}

.swatches {
    display: grid;
    grid-template-columns: repeat(auto-fill, 3rem);
    gap: 0.5rem;
    margin-top: 0.5rem;
}

.swatch {
    width: 3rem;
    height: 3rem;
    border: 0;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--line);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.swatch .icon {
    visibility: hidden;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.7));
}

.swatch[aria-checked="true"] {
    box-shadow:
        0 0 0 3px var(--surface),
        0 0 0 5px var(--accent);
}

.swatch[aria-checked="true"] .icon {
    visibility: visible;
}

.swatch.auto {
    background-image: linear-gradient(135deg, transparent 46%, var(--muted) 46% 54%, transparent 54%) !important;
}

.switch-row {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    min-height: 3rem;
    margin-top: 0.25rem;
    cursor: pointer;
}

.switch-row[hidden] {
    display: none;
}

.switch-text {
    display: flex;
    flex-direction: column;
}

.switch-text .field-hint {
    margin: 0;
}

.switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 3.25rem;
    height: 2rem;
    margin: 0;
    border-radius: 999px;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 2px var(--muted);
    cursor: pointer;
    transition: background 0.15s ease;
}

.switch::after {
    content: "";
    position: absolute;
    top: 0.375rem;
    left: 0.375rem;
    width: 1.25rem;
    height: 1.25rem;
    border-radius: 999px;
    background: var(--muted);
    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.switch:checked {
    background: var(--accent);
    box-shadow: none;
}

.switch:checked::after {
    transform: translateX(1.25rem);
    background: var(--on-accent);
}

.edit-face {
    width: 9rem;
    margin: 0 auto;
}

.edit-face .tile-name {
    font-size: 1.2rem;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.settings .section-title {
    margin: 0.75rem 0 0;
}

/* ---------------------------------------------------------------- a card at the till */

.till {

.slides::-webkit-scrollbar {
    display: none;
}

.slide {
    flex: 0 0 100%;

    justify-content: center;

.code-panel {

    max-width: 34rem;

    background: #ffffff;
    color: #111111;

    opacity: 0.85;

.band-name {
    font-size: 1.2rem;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.01em;
    min-width: 0;
}

/* Every code gets the same room, so the panels line up and nothing jumps while swiping. */
.code-area {
    display: flex;
    align-items: center;
    justify-content: center;
    height: clamp(10rem, 30dvh, 15rem);
    padding: 1rem 1rem 0.25rem;
}

.code-area svg {
    display: block;
    width: 100%;
    height: 100%;
}

/* The code is a button: a tap fills the screen with it. */
.code-tap {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: none;
    cursor: zoom-in;
}

.cant-draw {
    margin: 0.5rem 0;
    padding: 0.75rem;
    border-radius: 12px;
    background: #fff3d6;
    color: #4a2c00;
    font-weight: 600;
}

.code-number {
    margin: 0.5rem 1rem 0;
    padding-bottom: 1rem;
    text-align: center;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    color: #111;
    white-space: nowrap;
    overflow: hidden;
    user-select: text;
}

.code-number.wraps {
    white-space: normal;
    word-break: break-all;
}

.code-holder {
    margin: -0.5rem 1rem 1rem;
    text-align: center;
    color: #4b4a55;
    font-weight: 500;
}

.under-code {
    text-align: center;
    min-height: 1.5rem;
}

.position {
    margin: 0.6rem 0 0;
    font-size: 0.875rem;
    color: var(--muted);
}

.swipe-hint {
    margin: 0.25rem 1rem 0;
    font-size: 0.875rem;
    color: var(--on-tonal);
    font-weight: 600;
}

.card-details {
    max-width: 34rem;
    margin: 0 auto;
    padding: 0.5rem 1rem 1rem;
}

.card-details .section-title {
    margin: 1.25rem 0 0.5rem;
}

.info {
    margin-top: 0.75rem;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
}

.info-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.25rem 1rem;
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--line);
}

.info-row:first-child {
    border-top: 0;
}

.info-label {
    color: var(--muted);
}

.info-value {
    font-weight: 600;
    text-align: right;
    margin-left: auto;
}

.info-note {
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--line);
}

.info-note:first-child {
    border-top: 0;
}

.note-text {
    margin: 0.25rem 0 0;
    white-space: pre-wrap;
}

.info-line {
    margin: 0;
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
}

.photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr));
    gap: 0.75rem;
}

.photo-slot {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.photo-title {
    font-size: 0.875rem;
    color: var(--muted);
    font-weight: 600;
}

.photo-thumb {
    padding: 0;
    border: 0;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1.586;
    background: var(--surface-2);
    cursor: pointer;
}

.photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.photo-add {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    aspect-ratio: 1.586;
    min-height: min-content;
    padding: 0.5rem;
    border: 2px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius: 12px;
    background: transparent;
    color: var(--on-tonal);
    font-weight: 600;
    cursor: pointer;
}

.photo-add:active {
    background: var(--tonal);
}

.photo-view img {
    display: block;
    max-width: 100%;
    max-height: 70dvh;
    margin: 0 auto;
    border-radius: 12px;
}

.photo-view {
    padding: 0 1rem;
}

.more-details {
    margin-top: 1.25rem;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
}

.more-details summary {
    min-height: 3rem;
    padding: 0.75rem 1rem;
    font-weight: 600;
    cursor: pointer;
}

.card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.25rem;
}

.card-actions .btn {
    flex: 1 1 9rem;
}

/* ---------------------------------------------------------------- the bar above the keyboard */

.dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--keyboard, 0px);
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0.75rem calc(var(--safe-right) + 1rem) calc(var(--safe-bottom) + 0.75rem) calc(var(--safe-left) + 1rem);
    background: color-mix(in srgb, var(--bg) 94%, transparent);

    box-shadow: 0 -1px 0 var(--line);
}

.dock-btn {
    width: 100%;
    min-height: 3.5rem;
    font-size: 1.1rem;
    border-radius: 18px;
}

.screen.has-dock {
    padding-bottom: calc(var(--safe-bottom) + 7.5rem + var(--keyboard, 0px));
}

.dialog.full .dialog-body {
    padding-bottom: calc(var(--safe-bottom) + 7.5rem + var(--keyboard, 0px));
}

.dialog.full .dock {
    position: fixed;

.dialog.sheet {
    margin-bottom: var(--keyboard, 0px);
    max-height: calc(var(--vvh, 100dvh) - var(--safe-top) - 1rem);
}

.sheet-dock {
    position: sticky;
    bottom: calc(-1 * (1.25rem + var(--safe-bottom)));
    margin: 1rem -1.25rem calc(-1 * (1.25rem + var(--safe-bottom)));
    padding: 0.75rem 1.25rem calc(var(--safe-bottom) + 0.75rem);
    background: var(--surface);
    box-shadow: 0 -1px 0 var(--line);
}

/* ---------------------------------------------------------------- choosing what a card is */

.quick-row {
    display: flex;
    padding: 0 1rem 0.25rem;
}

.quick-row .btn {
    min-height: 2.75rem;
    padding: 0.35rem 1rem;
}

.scan-card {
    margin: 0.25rem 1rem 0.5rem;
    border-radius: 20px;
    overflow: hidden;
    background: #fff;
    color: #111;
    box-shadow: var(--shadow);
}

.scan-band {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    min-height: 3.25rem;
    padding: 0.5rem 0.75rem 0.5rem 1rem;
    background: var(--face-bg);
    background-image: linear-gradient(140deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.12));
    color: var(--face-fg);
}

.scan-name {
    flex: 1;
    min-width: 0;
    font-size: 1.2rem;
    font-weight: 800;
    line-height: 1.15;
}

.scan-name.placeholder {
    opacity: 0.8;
    font-weight: 700;
}

.scan-ok {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.2rem 0.6rem 0.2rem 0.4rem;
    border-radius: 999px;
    background: #e3f6e8;
    color: #135c2a;
    font-weight: 700;
    font-size: 0.9rem;
    white-space: nowrap;
}

.scan-ok .icon {
    width: 1.1rem;
    height: 1.1rem;
}

.scan-code {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    padding: 0.75rem 1rem;
}

.scan-bars {
    width: 100%;
    height: 3.5rem;
}

.scan-bars.square {
    height: 5.5rem;
}

.scan-bars svg {
    display: block;
    width: 100%;
    height: 100%;
}

.scan-number {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    text-align: center;
}

.scan-number.wraps {
    white-space: normal;
    word-break: break-all;
}

.name-block {
    padding: 0.5rem 1rem 0.25rem;
}

.name-label {
    display: block;
    margin: 0 0 0.4rem;
    font-size: 1.1rem;
    font-weight: 700;
}

.big-field {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 3.75rem;
    padding: 0 0.25rem 0 1rem;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: inset 0 0 0 2px var(--line);
    color: var(--muted);
}

.big-field:focus-within {
    box-shadow: inset 0 0 0 2.5px var(--accent);
}

.big-input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    font-size: 1.3rem;
    font-weight: 600;
    padding: 0.75rem 0;
    outline: none;
}

.big-input::placeholder {
    font-weight: 400;
    color: var(--muted);
}

.not-found {
    margin: 0.75rem 1rem 0;
    font-size: 1.05rem;
    color: var(--muted);
}

.tile-hint {
    margin: 0.75rem 1rem 0;
}

.own-face {
    flex-direction: column;
    gap: 0.25rem;
    background: var(--surface);
    background-image: none;
    color: var(--text);
    box-shadow: inset 0 0 0 2.5px var(--accent);
    --face-line: transparent;
}

.own-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.1rem 0.5rem 0.1rem 0.3rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
}

.own-badge .icon {
    width: 1rem;
    height: 1rem;
}

.tiles.only-own {
    grid-template-columns: 1fr;
    margin-top: 0.75rem;
}

.tiles.only-own .tile-face {
    aspect-ratio: auto;
    min-height: 6.5rem;
    padding: 0.85rem 1rem;
    gap: 0.5rem;
}

.tiles.only-own .tile-name {
    font-size: 1.5rem;
}

.queue .scan-card {
    margin-top: 0.5rem;

.face-button,

    -webkit-touch-callout: none;
}

.face-button.lifted .face {

.faces.dragging .face-button:not(.dragged) {

}

.hold-hint {
    margin: -0.25rem 1rem 0.25rem;
    font-size: 0.9rem;
    color: var(--muted);
}

.menu-title {
    margin: 0.25rem 1rem 0.5rem;

}

.menu-hint {
    margin: 0.5rem 1rem 0.25rem;
}

.menu-item[disabled] {

}

.menu-item.on {

    font-weight: 700;
}

@media (orientation: landscape) and (max-height: 560px) {
    .scan-card {
        display: flex;
        align-items: stretch;
    }

    .scan-band {
        flex: 1;
    }

    .scan-code {
        flex: 1;
        padding: 0.4rem 1rem;
    }

    .scan-bars {
        height: 2.25rem;

    .dock {
        flex-direction: row;
        padding-top: 0.5rem;
        padding-bottom: calc(var(--safe-bottom) + 0.5rem);
    }

    .dock-btn {
        min-height: 3rem;
    }
}

@media (orientation: landscape) and (max-height: 560px) {
    .card-screen {

const COUNTRIES = ["sk", "cz", "int"];

/** The country whose list a phone language opens with: Slovak → Slovakia, Czech → Czechia, others international. */
function countryFor(language) {
  const lang = String(language || "").toLowerCase();
  if (lang.startsWith("sk")) return "sk";
  if (lang.startsWith("cs") || lang.startsWith("cz")) return "cz";
  return "int";
}

/** A word as search compares it: lower case, no accents, letters and digits only. */
function fold(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

const byId = new Map(BRANDS.map((b) => [b.id, b]));
const byName = new Map();
for (const b of BRANDS) {
  for (const name of [b.name, ...b.aliases]) {
    const key = fold(name).replace(/ /g, "");
    if (!byName.has(key)) byName.set(key, b);
  }
}

function brandById(id) {
  return (id && byId.get(id)) || null;
}

/** The store a card's name stands for, when it is one of the list's names (cards saved before the list existed). */
function brandForName(name) {
  const key = fold(name).replace(/ /g, "");
  return (key && byName.get(key)) || null;
}

/** The popular stores of `country`, most popular first. */
function popular(country) {
  return BRANDS.filter((b) => b[country]).sort((a, b) => a[country] - b[country]);
}

/** Every store of `country`'s list, A to Z, then the others. */
function allStores(country) {
  const name = (a, b) => fold(a.name).localeCompare(fold(b.name));
  const here = BRANDS.filter((b) => b[country]).sort(name);
  const elsewhere = BRANDS.filter((b) => !b[country]).sort(name);
  return { here, elsewhere };
}

/**
 * The stores that match `query`, best first: a name that starts with it, then a word of the name or of another name
 * that starts with it, then one that contains it. Ties go to the store popular in `country`, then by name.
 */
function search(query, country) {
  const q = fold(query);
  if (!q) return popular(country);
  const compact = q.replace(/ /g, "");
  const scored = [];
  for (const b of BRANDS) {
    let best = 0;
    for (const [i, name] of [b.name, ...b.aliases].entries()) {
      const f = fold(name);
      const flat = f.replace(/ /g, "");
      let score = 0;
      if (flat === compact) score = 100;
      else if (flat.startsWith(compact)) score = 80;
      else if (f.split(" ").some((w) => w.startsWith(q))) score = 60;
      else if (flat.includes(compact)) score = 30;
      if (score && i > 0) score -= 5;
      best = Math.max(best, score);
    }
    if (best) scored.push([best + (b[country] ? 10 : 0), b]);
  }
  return scored
    .sort(
      (x, y) => y[0] - x[0] || (x[1][country] || 999) - (y[1][country] || 999) || x[1].name.localeCompare(y[1].name),
    )
    .map(([, b]) => b);
}

/** The colours of a store's tile: its tone and the ink of its name. */
function brandColours(brand) {
  const tone = TONES[brand.tone] || TONES.slate;
  return { bg: tone.bg, fg: brand.ink ? INKS[brand.ink] : tone.fg };
}
  return { TONES, INKS, BRANDS, COUNTRIES, countryFor, fold, brandById, brandForName, popular, allStores, search, brandColours };
})();

const STRINGS = { en: EN, sk: SK };
const LANGUAGES = ["en", "sk"];

/** The language the page speaks: the user's choice, else the phone's when it is Slovak (or Czech), else English. */
function pickLanguage(choice, phone) {
  if (choice === "en" || choice === "sk") return choice;
  const lang = String(phone || "").toLowerCase();
  return lang.startsWith("sk") || lang.startsWith("cs") ? "sk" : "en";
}

/** Which plural form `n` takes in `lang`. */
function pluralForm(lang, n) {
  if (lang === "sk") {
    if (n === 1) return "one";
    if (Number.isInteger(n) && n >= 2 && n <= 4) return "few";
    return "other";
  }
  return n === 1 ? "one" : "other";
}

/** A function that reads a message in `lang` and fills in its values; English stands in for a missing text. */
function translator(lang) {
  const table = STRINGS[lang] || EN;
  return (key, values = {}) => {
    let message = table[key] ?? EN[key] ?? key;
    if (typeof message === "object") {
      const form = pluralForm(lang, Number(values.n));
      message = message[form] ?? message.other;
    }
    return message.replace(/\{(\w+)\}/g, (m, name) => (values[name] === undefined ? m : String(values[name])));
  };
}
  return { STRINGS, LANGUAGES, pickLanguage, pluralForm, translator };
})();

// The app's data. Inside Zapli the cards are the app's own declared records (zapli.data), so backups, the home-screen
// widget and expiry reminders see them while the app is closed; the page's settings and the photos of cards live in
// zapli.data.kv. In a plain browser (a preview) the same calls run on made-up cards kept in this browser's storage.

const PREVIEW_KEY = "loyalty-cards-preview-v3";
const FIELDS = [
  "store",
  "number",
  "format",
  "holder",
  "group",
  "points",
  "expires",
  "note",
  "color",
  "pinned",
  "archived",
  "brand",
  "remind",
];

/** The fields a page may write, with empty values left out (a new record simply has none there). */
function writable(values, { keepEmpty = false } = {}) {
  const out = {};
  for (const key of FIELDS) {
    if (!(key in values)) continue;
    const v = values[key];
    if (v === "" || v === undefined || (v === null && !keepEmpty)) continue;
    out[key] = v;
  }
  return out;
}

class Store {
  constructor() {
    this.live = false;
    this.zapli = null;
    this.cards = [];
    this.importLog = null;
    this.photos = { face: new Set(), back: new Set() };
    this.photoCache = new Map();
    this.ui = {};
    this.listeners = new Set();
    this.preview = null;
    this.scheduled = false;
  }

  on(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  }

  /** Tells the screens once per frame that something changed. */
  changed() {
    if (this.scheduled) return;
    this.scheduled = true;
    const run = () => {
      this.scheduled = false;
      for (const listener of this.listeners) listener();
    };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(run);
    else setTimeout(run, 0);
  }

  card(id) {
    return this.cards.find((c) => c.id === id) || null;
  }

  /** Starts the store: inside Zapli on the app's records, else on example cards in this browser. */
  async open() {
    const zapli = typeof window !== "undefined" ? window.zapli : undefined;
    if (zapli && zapli.data) {
      this.zapli = zapli;
      try {
        await zapli.ready;
        this.live = zapli.supports("data.entities");
      } catch {
        this.live = false;
      }
    }
    if (!this.live) return this.openPreview();
    try {
      this.ui = (await this.zapli.data.kv.get("ui")) || {};
    } catch {
      this.ui = {};
    }
    await Promise.all([this.watchCards(), this.loadPhotoKeys()]);
    this.zapli.data.watch("importLog", { sort: ["-at"], limit: 1 }, (items) => {
      this.importLog = items[0] || null;
      this.changed();
    });
    this.zapli.app.on("resume", () => this.changed());
  }

  watchCards() {
    return new Promise((resolve) => {
      let first = true;
      this.zapli.data.watch("card", { sort: ["store"], limit: 2000 }, (items) => {
        this.cards = items;
        this.changed();
        if (first) {
          first = false;
          resolve();
        }
      });
      // A watch that never answers must not hold the app back.
      setTimeout(resolve, 4000);
    });

  async loadPhotoKeys() {

      const keys = await this.zapli.data.kv.keys("photo:");
      for (const key of keys) {
        const [, side, id] = key.split(":");
        if (this.photos[side]) this.photos[side].add(id);

  async update(id, patch) {

    const record = await this.zapli.data.update("card", id, patch);

    return record;
