}

/** The first barcode of one picture the user picks, or null (with a word when there is none). */
async function codeFromOnePicture() {
  let files;
  try {
    files = await pickPictures({ multiple: false });
  } catch (error) {
    showProblem(error);
    return null;
  }
  if (!files || !files.length) return null;
  try {
    const codes = await readCodes(files[0]);
    if (!codes.length) snack(t("noCodeInPicture"));
    return codes[0] || null;
  } catch (error) {
    showProblem(error);
    return null;
  }
}

/**
 * Cards from screenshots or photos (how people bring cards over from another wallet): pick up to 20 pictures, read
 * the barcode of each, then name each one under its picture, as after a scan. Lands on the first card added, with
 * Undo for all of them. Call it straight from a tap.
 */
async function importFromPictures() {
  if (ctx.store.live && !canPickPictures()) {
    snack(t("picturesUnavailable"));
    return;
  }
  let files;
  try {
    files = await pickPictures({ multiple: true });
  } catch (error) {
    showProblem(error);
    return;
  }
  if (!files || !files.length) return;
  if (!canReadPictures()) {
    snack(t("onPhoneOnly"));
    return;
  }
  snack(t("reading"));
  const queue = [];
  for (const file of files) {
    try {
      const codes = await readCodes(file);
      if (!codes.length) continue;
      const thumb = await shrink(file, { side: 900 }).catch(() => null);
      for (const code of codes.slice(0, 3)) queue.push({ ...code, thumb });
    } catch {
      // A picture that cannot be read is left out.
    }
  }
  const fresh = queue.filter((item) => !ctx.store.cards.some((c) => c.number === cleanNumber(item.value)));
  if (!fresh.length) {
    snack(queue.length ? t("allThere") : t("noCodesInPictures"));
    return;
  }
  const added = [];
  for (let i = 0; i < fresh.length; i++) {
    const item = fresh[i];
    const choice = await nameDialog(item, i + 1, fresh.length);
    if (choice === undefined) break;
    if (!choice) continue;
    const value = cleanNumber(item.value);
    const name = choice.brand ? choice.brand.name : choice.name || defaultName(value);
    try {
      added.push(
        await ctx.store.add({
          store: name,
          number: value,
          format: item.format,
          group: choice.brand ? choice.brand.kind : "storefront",
          brand: choice.brand ? choice.brand.id : undefined,
        }),
      );
      buzz("light");
    } catch (error) {
      showProblem(error);
    }
  }
  if (added.length)
    land(
      added[0],
      t("queueDone", { n: added.length }),
      added.map((c) => c.id),
    );
  else snack(t("queueNone"));
}

/** One picture of the queue: the picture and its code above the chooser. Resolves {brand} or {name}, null to skip. */
function nameDialog(item, i, n) {
  return dialog(
    (close) => {
      const chooser = storeChooser({
        code: { value: item.value, format: item.format },
        picture: item.thumb,
        noName: true,
        onStore: (brand) => close({ brand }),
        onOwn: (name) => close({ name: name.trim() }),
      });
      const content = h(
        "div",
        { class: "queue" },
        h(
          "div",
          { class: "sheet-head" },
          h("h2", { class: "sheet-title", text: t("queueTitle", { i, n }) }),
          button(t("skip"), () => close(null), "text"),
          button(t("close"), () => close(undefined), "icon", { iconName: "close" }),
        ),
        chooser.element,
        chooser.bar,
      );
      requestAnimationFrame(() => chooser.fit());
      return content;
    },
    { full: true, label: t("queueTitle", { i, n }) },
  );
}

/** Imports a CSV of cards (this app's backup, or a card list from another app). Call it straight from a tap. */
async function importCardFile() {
  const store = ctx.store;
  if (!store.live) {
    snack(t("onPhoneOnly"));
    return;
  }
  try {
    await store.run("importCards");
  } catch (error) {
    showProblem(error);
    return;
  }
  let log = null;
  try {
    const page = await store.zapli.data.query("importLog", { sort: ["-at"], limit: 1 });
    log = page.items[0] || null;
  } catch {
    log = store.importLog;
  }
  if (!log || Date.now() - Date.parse(log.at) > 120000) return;
  dialog(
    (close) =>
      h(
        "div",
        { class: "ask" },
        h("h2", { class: "ask-title", text: t("importFinished") }),
        h("p", {
          class: "ask-body",
          text: t("importSummary", { added: log.added || 0, dup: log.duplicates || 0, skipped: log.skipped || 0 }),
        }),
        log.skipped && log.problems ? h("p", { class: "ask-body", text: t("rowsLeftOut") }) : null,
        log.skipped && log.problems ? h("pre", { class: "problems", text: log.problems }) : null,
        h(
          "div",
          { class: "ask-buttons" },
          button(t("done"), () => close(), "filled"),
        ),
      ),
    { label: t("importFinished") },
  );
}

/** Saves every card to a CSV file the user places. Call it straight from a tap. */
async function backupCards() {
  if (!ctx.store.live) {
    snack(t("onPhoneOnly"));
    return;
  }
  try {
    await ctx.store.run("exportCards");
  } catch (error) {
    showProblem(error);
  }
}
  return { problemText, showProblem, scanCode, defaultName, saveNewCard, numberSheet, importFromPictures, importCardFile, backupCards };
})();

// ---------------------------------------------------------------- js/screens/wallet.mjs
modules["js/screens/wallet.mjs"] = (() => {
// The wallet: the cards as faces, favourites first, then in the order the user chose (most used by default, or their
// own); search; Add. Holding a card lifts it: let go for its menu (favourite, move up or down, edit), or drag it to
// another place, which switches the wallet to the user's own order.

const { fold } = modules["js/brands.mjs"];
const { cardFace, fitNames } = modules["js/faces.mjs"];
const { icon } = modules["js/icons.mjs"];
const { ORDERS, moved, orderedCards } = modules["js/order.mjs"];
const { button, buzz, ctx, dialog, h, snack, t, topBar } = modules["js/ui.mjs"];
const { backupCards, importCardFile, importFromPictures } = modules["js/screens/transfer.mjs"];

/** How long a finger rests on a card before it lifts: the phone's own long press, so a tap or a scroll never lifts one. */
const HOLD_MS = 400;
const SLOP = 10;

let query = "";

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

/** Whether a card matches what was typed in the search: its store, number, name on it or note, without accents. */
function matches(card, text) {
  const q = fold(text);
  if (!q) return true;
  return [card.store, card.number, card.holder, card.note].some((v) => fold(v).includes(q));
}

function openCard(card) {
  ctx.go("#/card/" + encodeURIComponent(card.id));
}

/** The user's own order saved, switching to it; when the wallet had another order, a word with Undo. */
async function saveOwnOrder(manual, message) {
  const store = ctx.store;
  const before = { order: store.ui.order || "use", manual: store.ui.manual || [] };
  await store.saveUi({ order: "mine", manual, held: true });
  if (before.order !== "mine") {
    snack(t("orderNowMine"), { label: t("undo"), run: () => store.saveUi(before) });
  } else if (message) snack(message);
}

/** Moves a card one place up (-1) or down (1) among its group, in the user's own order. */
async function moveCard(id, delta) {
  const store = ctx.store;
  const manual = moved(store.cards, store.ui.order, store.ui.manual, id, delta);
  if (!manual) return false;
  await saveOwnOrder(manual, delta < 0 ? t("movedUp") : t("movedDown"));
  return true;
}

async function toggleFavourite(card) {
  await ctx.store.update(card.id, { pinned: !card.pinned });
  snack(card.pinned ? t("unstarred", { store: card.store }) : t("starred", { store: card.store }));
}

/** A card's menu from the wallet: favourite, move up or down, edit, show the code. */
function cardMenu(card) {
  const store = ctx.store;
  if (!store.ui.held) store.saveUi({ held: true });
  const canUp = Boolean(moved(store.cards, store.ui.order, store.ui.manual, card.id, -1));
  const canDown = Boolean(moved(store.cards, store.ui.order, store.ui.manual, card.id, 1));
  dialog(
    (close) => {
      const item = (label, iconName, run, { disabled = false, filled = false } = {}) =>
        h(
          "button",
          {
            type: "button",
            class: "menu-item",
            disabled,
            onClick: () => {
              close();
              run();
            },
          },
          icon(iconName, { filled }),
          h("span", { text: label }),
        );
      return h(
        "div",
        { class: "menu", role: "menu" },
        h("h2", { class: "menu-title", text: card.store }),
        item(card.pinned ? t("removeFavourite") : t("addFavourite"), "star", () => toggleFavourite(card), {
          filled: !card.pinned,
        }),
        item(t("moveUp"), "chevronUp", () => moveCard(card.id, -1), { disabled: !canUp }),
        item(t("moveDown"), "chevronDown", () => moveCard(card.id, 1), { disabled: !canDown }),
        item(t("edit"), "edit", () => ctx.go("#/edit/" + encodeURIComponent(card.id))),
        item(t("showCode"), "scan", () => openCard(card)),
      );
    },
    { sheet: true, label: card.store },
  );
}

// ---------------------------------------------------------------- holding and dragging a card

let press = null;
let quietUntil = 0;

/** Holding a face: after a moment it lifts; moved, it drags; let go without moving, its menu opens. */
function holdable(btn, card, canDrag) {
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
  btn.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || press) return;
    press = { btn, card, x0: e.clientX, y0: e.clientY, lifted: false, dragging: false, pointerId: e.pointerId };
    press.timer = setTimeout(() => {
      if (!press || press.btn !== btn) return;
      press.lifted = true;
      quietUntil = Date.now() + 600;
      btn.classList.add("lifted");
      buzz("light");
    }, HOLD_MS);
  });
  btn.addEventListener("pointermove", (e) => {
    if (!press || press.btn !== btn) return;
    const dx = e.clientX - press.x0;
    const dy = e.clientY - press.y0;
    const far = Math.hypot(dx, dy) > SLOP;
    if (!press.lifted) {
      if (far) endPress();
      return;
    }
    if (!press.dragging && far && canDrag) startDrag(e);
    if (press.dragging) dragTo(e);
  });
  btn.addEventListener("pointerup", () => {
    if (!press || press.btn !== btn) return;
    const { lifted, dragging } = press;
    if (dragging) drop();
    else endPress();
    if (lifted && !dragging) cardMenu(card);
  });
  btn.addEventListener("pointercancel", () => {
    if (press && press.btn === btn && !press.dragging) endPress();
  });
}

function endPress() {
  if (!press) return;
  clearTimeout(press.timer);
  press.btn.classList.remove("lifted", "dragged");
  press.btn.style.transform = "";
  const grid = press.btn.parentElement;
  if (grid) grid.classList.remove("dragging");
  press = null;
}

function startDrag(e) {
  press.dragging = true;
  try {
    press.btn.setPointerCapture(e.pointerId);
  } catch {
    // Without the capture the face still follows while the finger stays over the wallet.
  }
  press.btn.classList.add("dragged");
  press.btn.parentElement.classList.add("dragging");
  const r = press.btn.getBoundingClientRect();
  press.offX = press.x0 - r.left;
  press.offY = press.y0 - r.top;
}

/** The face follows the finger; passing over another face of its group takes that face's place. */
function dragTo(e) {
  const btn = press.btn;
  const grid = btn.parentElement;
  for (const other of grid.children) {
    if (other === btn) continue;
    const r = other.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) continue;
    const before = [...grid.children].indexOf(btn) > [...grid.children].indexOf(other);
    grid.insertBefore(btn, before ? other : other.nextSibling);
    break;
  }
  btn.style.transform = "";
  const r = btn.getBoundingClientRect();
  btn.style.transform = `translate(${e.clientX - press.offX - r.left}px, ${e.clientY - press.offY - r.top}px) scale(1.04)`;
  // Near the top or bottom of the screen, the wallet scrolls along.
  if (e.clientY < 90) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - 110) window.scrollBy(0, 14);
}

async function drop() {
  const results = press.btn.closest(".results");
  endPress();
  const manual = [...results.querySelectorAll(".face-button")].map((b) => b.dataset.id);
  buzz("light");
  await saveOwnOrder(manual, "");
}

function faceButton(card, day, canDrag) {
  const store = ctx.store;
  const face = cardFace(card, { today: day });
  const btn = h(
    "button",
    {
      type: "button",
      class: "face-button",
      "data-id": card.id,
      "aria-label": t("faceLabel", { store: card.store, digits: String(card.number).slice(-4) }),
      onClick: () => {
        if (Date.now() < quietUntil) return;
        openCard(card);
      },
    },
    face,
  );
  holdable(btn, card, canDrag);
  if (store.hasPhoto("face", card.id)) {
    store.photo("face", card.id).then((photo) => {
      if (!photo || !btn.isConnected) return;
      btn.replaceChildren(cardFace(card, { today: day, photo }));
      fitNames(btn);
    });
  }
  return btn;
}

function grid(cards, day, canDrag) {
  const el = h(
    "div",
    { class: "faces" },
    cards.map((c) => faceButton(c, day, canDrag)),
  );
  // While a face is lifted, the finger moves the face, not the page.
  el.addEventListener(
    "touchmove",
    (e) => {
      if (press && press.lifted) e.preventDefault();
    },
    { passive: false },
  );
  return el;
}

/** The orders to choose from, as a short sheet. */
function orderMenu() {
  const store = ctx.store;
  const current = store.ui.order || "use";
  const label = { use: t("orderUse"), recent: t("orderRecent"), name: t("orderName"), mine: t("orderMine") };
  dialog(
    (close) =>
      h(
        "div",
        { class: "menu", role: "radiogroup", "aria-label": t("order") },
        h("h2", { class: "menu-title", text: t("order") }),
        ORDERS.map((o) =>
          h(
            "button",
            {
              type: "button",
              class: "menu-item" + (o === current ? " on" : ""),
              role: "radio",
              "aria-checked": o === current ? "true" : "false",
              onClick: () => {
                close();
                store.saveUi({ order: o });
              },
            },
            icon(o === current ? "check" : "blank"),
            h("span", { text: label[o] }),
          ),
        ),
        h("p", { class: "field-hint menu-hint", text: t("orderHint") }),
      ),
    { sheet: true, label: t("order") },
  );
}

function emptyArt() {
  // Three cards fanned out: the app's own drawing for an empty wallet.
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 220 150");
  svg.setAttribute("class", "empty-art");
  svg.setAttribute("aria-hidden", "true");
  const cardShape = (x, y, rotate, fill, opacity) => {
    const r = document.createElementNS(ns, "rect");
    for (const [k, v] of Object.entries({
      x,
      y,
      width: 120,
      height: 76,
      rx: 12,
      fill,
      opacity,
      transform: `rotate(${rotate} ${x + 60} ${y + 38})`,
    }))
      r.setAttribute(k, v);
    svg.appendChild(r);
  };
  cardShape(22, 44, -14, "var(--art-a)", 1);
  cardShape(78, 40, 12, "var(--art-b)", 1);
  cardShape(50, 30, -2, "var(--art-c)", 1);
  const bars = document.createElementNS(ns, "path");
  let d = "";
  [0, 3, 5, 9, 11, 14, 18, 20, 23, 27, 29, 32].forEach((x, i) => (d += `M${78 + x} 70v${i % 3 ? 18 : 22}`));
  bars.setAttribute("d", d);
  bars.setAttribute("stroke", "#fff");
  bars.setAttribute("stroke-width", "1.6");
  svg.appendChild(bars);
  return svg;
}

function empty() {
  return h(
    "div",
    { class: "empty first-run" },
    emptyArt(),
    h("h2", { text: t("emptyTitle") }),
    h("p", { text: t("emptyBody") }),
    h(
      "div",
      { class: "empty-actions" },
      button(t("addFirst"), () => ctx.go("#/add"), "filled", { iconName: "plus" }),
      button(t("bringOver"), () => importFromPictures(), "tonal", { iconName: "images" }),
      button(t("importFile"), () => importCardFile(), "text", { iconName: "upload" }),
    ),
  );
}

function openMenu() {
  dialog(
    (close) => {
      const item = (label, iconName, run) =>
        h(
          "button",
          {
            type: "button",
            class: "menu-item",
            onClick: () => {
              close();
              run();
            },
          },
          icon(iconName),
          h("span", { text: label }),
        );
      return h(
        "div",
        { class: "menu", role: "menu" },
        item(t("order"), "sort", () => orderMenu()),
        item(t("menuShots"), "images", () => importFromPictures()),
        item(t("menuImport"), "upload", () => importCardFile()),
        item(t("menuBackup"), "download", () => backupCards()),
        item(t("menuArchived"), "archive", () => ctx.go("#/archived")),
        item(t("menuSettings"), "settings", () => ctx.go("#/settings")),
      );
    },
    { sheet: true, label: t("menu") },
  );
}

function render() {
  const store = ctx.store;
  const day = today();
  const cards = orderedCards(store.cards, store.ui.order, store.ui.manual);
  const screen = h("div", { class: "screen wallet" });
  screen.appendChild(
    topBar({ title: t("appName"), large: true, actions: [button(t("menu"), openMenu, "icon", { iconName: "more" })] }),
  );
  if (!cards.length) {
    screen.appendChild(empty());
    return screen;
  }
  const results = h("div", { class: "results" });
  const draw = () => {
    results.textContent = "";
    const shown = cards.filter((c) => matches(c, query));
    if (!shown.length) {
      results.appendChild(h("p", { class: "no-match", role: "status", text: t("noMatch", { q: query.trim() }) }));
      return;
    }
    const favourites = shown.filter((c) => c.pinned);
    const rest = shown.filter((c) => !c.pinned);
    // A card moves only among all the cards, not among search results.
    const canDrag = !query.trim();
    if (favourites.length && !query) {
      results.appendChild(h("h2", { class: "section-title", text: t("favourites") }));
      results.appendChild(grid(favourites, day, canDrag));
      if (rest.length) results.appendChild(h("h2", { class: "section-title", text: t("otherCards") }));
      if (rest.length) results.appendChild(grid(rest, day, canDrag));
    } else results.appendChild(grid(shown, day, canDrag));
    requestAnimationFrame(() => fitNames(results));
  };
  const input = h("input", {
    type: "search",
    class: "search-input",
    placeholder: t("searchCards"),
    value: query,
    autocomplete: "off",
    spellcheck: "false",
    enterkeyhint: "search",
    onInput: (e) => {
      query = e.target.value;
      clear.hidden = !query;
      draw();
    },
  });
  const clear = button(
    t("clearSearch"),
    () => {
      query = "";
      input.value = "";
      clear.hidden = true;
      draw();
      input.focus();
    },
    "icon",
    { iconName: "close", extraClass: "search-clear" },
  );
  clear.hidden = !query;
  // The field's name is the label's text, which screen readers read on the phone as in a browser.
  if (cards.length > 3)
    screen.appendChild(
      h(
        "label",
        { class: "search" },
        h("span", { class: "unseen", text: t("searchCards") }),
        icon("search"),
        input,
        clear,
      ),
    );
  // Until the user has held a card once, one line says what holding does.
  if (cards.length > 1 && !store.ui.held) screen.appendChild(h("p", { class: "hold-hint", text: t("holdHint") }));
  draw();
  screen.appendChild(results);
  screen.appendChild(
    h(
      "button",
      { type: "button", class: "fab", onClick: () => ctx.go("#/add") },
      icon("plus"),
      h("span", { class: "fab-label", text: t("addCard") }),
    ),
  );
  return screen;
}

function mounted() {
  fitNames(document.getElementById("main"));
}

function resized() {
  fitNames(document.getElementById("main"));
}
  return { HOLD_MS, matches, moveCard, toggleFavourite, render, mounted, resized };
})();

// ---------------------------------------------------------------- js/screens/add.mjs
modules["js/screens/add.mjs"] = (() => {
// Adding a card, on one screen whichever way it starts:
// - nothing scanned yet (#/add): tap the store's tile and the scanner opens at once; or type a name of your own and
//   add it (the scanner opens then); or scan first from the bar at the bottom;
// - after a scan (#/add?code=…&format=…, so a rotation keeps the code): the code that was read, one field that finds
//   the store or names the card, the store tiles, "Add ‘…’ as a new card" and "Save without a name".
// A scanner closed without a code leads to the sheet for typing the number. The phone opens the scanner only from a
// tap, so Done on the keyboard opens that sheet instead, whose own button scans. Every way ends on the new card.

const { icon } = modules["js/icons.mjs"];
const { ctx, h, t, topBar } = modules["js/ui.mjs"];
const { storeChooser } = modules["js/screens/chooser.mjs"];
const { importFromPictures, numberSheet, saveNewCard, scanCode } = modules["js/screens/transfer.mjs"];

let chooser = null;

function render(route) {
  const code = route.params.get("code");
  const scanned = code ? { value: code, format: route.params.get("format") || "auto" } : null;
  const query = route.params.get("q") || "";
  const screen = h("div", { class: "screen add has-dock" });
  screen.appendChild(
    topBar({
      title: scanned ? t("newTitle") : t("addTitle"),
      onBack: () => ctx.back(),
      backIcon: "close",
      backLabel: t("close"),
    }),
  );
  if (!scanned) {
    screen.appendChild(
      h(
        "div",
        { class: "quick-row" },
        h(
          "button",
          { type: "button", class: "btn tonal", onClick: () => importFromPictures() },
          icon("images"),
          h("span", { class: "btn-label", text: t("fromShots") }),
        ),
      ),
    );
  }
  // The text typed stays in the address (without a new history entry), so a rotation keeps it.
  const remember = (q) => {
    const params = new URLSearchParams(route.params);
    if (q) params.set("q", q);
    else params.delete("q");
    const rest = params.toString();
    ctx.replace("#/add" + (rest ? "?" + rest : ""), { quiet: true });
  };
  chooser = storeChooser({
    code: scanned,
    query,
    noName: true,
    onQuery: remember,
    onStore: async (brand) => {
      if (scanned) return saveNewCard({ brand, number: scanned.value, format: scanned.format });
      const read = await scanCode();
      if (read) await saveNewCard({ brand, number: read.value, format: read.format });
      else numberSheet(brand);
    },
    onOwn: async (name) => {
      if (scanned) return saveNewCard({ store: name, number: scanned.value, format: scanned.format });
      const read = await scanCode();
      if (read) await saveNewCard({ store: name, number: read.value, format: read.format });
      else numberSheet(null, { name });
    },
    onScan: scanned
      ? null
      : async () => {
          const read = await scanCode();
          if (read) ctx.replace("#/add?" + new URLSearchParams({ code: read.value, format: read.format }));
          else numberSheet(null);
        },
    // Done on the keyboard: after a scan it saves like the bar's button; before one it needs no tap.
    onDone: scanned
      ? null
      : ({ brand, name }) => {
          if (brand) numberSheet(brand);
          else if (name) numberSheet(null, { name });
          else document.activeElement.blur();
        },
  });
  screen.appendChild(chooser.element);
  screen.appendChild(chooser.bar);
  return screen;
}

function mounted() {
  if (chooser) chooser.fit();
}

function resized() {
  if (chooser) chooser.fit();
}

/** The screen keeps what was typed while the cards change underneath. */
const keep = true;

function leave() {
  chooser = null;
}
  return { render, mounted, resized, keep, leave };
})();

// ---------------------------------------------------------------- js/screens/card.mjs
modules["js/screens/card.mjs"] = (() => {
// A card at the till: its code big on white, the number under it, the screen at full brightness and kept on; a swipe
// sideways shows the next card of the wallet, and a tap on the code fills the screen with it. Below: points, expiry,
// the name on the card, the note, its photos.

const { encode, toSvg, FORMATS } = modules["js/barcode/index.mjs"];
const { cardColours, fitLine, fitNames } = modules["js/faces.mjs"];
const { FORMAT_NAMES, drawnFormat, groupedNumber } = modules["js/formats.mjs"];
const { icon, kindIcon } = modules["js/icons.mjs"];
const { canPickPictures, canTakePhoto, pickPictures, shrink, takePhoto } = modules["js/photos.mjs"];
const { button, confirmDialog, ctx, dialog, formatDate, formatNumber, h, hideSnack, snack, t, topBar } = modules["js/ui.mjs"];
const { showProblem } = modules["js/screens/transfer.mjs"];
const { orderedCards } = modules["js/order.mjs"];
const { moveCard } = modules["js/screens/wallet.mjs"];

const USED_AFTER_MS = 1500;

let state = null;

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// ---------------------------------------------------------------- brightness

/** Full brightness and the screen kept on while a code shows; the phone ends both when the app leaves the front. */
async function brighten(on) {
  try {
    await ctx.store.run("screenOn", { on });
    if (on && state && state.dim) {
      state.dim = false;
      refresh();
    }
  } catch {
    if (on && state) {
      state.dim = true;
      refresh();
    }
  }
}

// ---------------------------------------------------------------- the code

/** The code of a card as SVG markup, or null when its number does not fit its type. */
function codeMarkup(card, label) {
  const format = drawnFormat(card);
  const result = encode(card.number, format);
  if (!result.ok) return null;
  return toSvg(result.symbol, format, { label });
}

function slide(card) {
  const colours = cardColours(card);
  const format = drawnFormat(card);
  const square = FORMATS[format] && FORMATS[format].square;
  const panel = h(
    "div",
    {
      class: "code-panel" + (square ? " square" : "") + (format === "pdf417" ? " stacked" : ""),
      style: `--face-bg:${colours.bg};--face-fg:${colours.fg}`,
    },
    h(
      "div",
      { class: "code-band" },
      h("span", { class: "band-kind" }, kindIcon(card.group)),
      h("span", { class: "band-name", text: card.store }),
    ),
    h("div", { class: "code-area", "data-code": card.id }),
    h("p", { class: "code-number", text: groupedNumber(card.number) }),
    card.holder ? h("p", { class: "code-holder", text: card.holder }) : null,
  );
  return h("div", { class: "slide", "data-id": card.id }, panel);
}

/** Draws the codes of the slide on show and its neighbours (the others wait until they come near). */
function drawCodes() {
  if (!state) return;
  const around = [state.index - 1, state.index, state.index + 1];
  for (const i of around) {
    const card = state.cards[i];
    if (!card) continue;
    const area = state.slides.querySelector(`[data-code="${CSS.escape(card.id)}"]`);
    if (!area || area.dataset.drawn) continue;
    area.dataset.drawn = "1";
    const markup = codeMarkup(card, t("codeLabel", { store: card.store, number: card.number }));
    if (markup) {
      const tap = h("button", {
        type: "button",
        class: "code-tap",
        "aria-label": t("codeFull"),
        onClick: () => openFull(card),
      });
      tap.innerHTML = markup;
      area.appendChild(tap);
    } else area.appendChild(h("p", { class: "cant-draw", text: t("cantDraw") }));
    const number = area.parentElement.querySelector(".code-number");
    if (number) fitLine(number);
  }
}

// ---------------------------------------------------------------- the code full screen

let fullOpen = false;

/** The card screen's address; `full` while the code fills the screen, so a reload after a rotation opens it again. */
function cardHash(card, full = false) {
  return "#/card/" + encodeURIComponent(card.id) + (full ? "?full=1" : "");
}

/**
 * The code alone on white, as large as the screen allows, the number under it in large digits and the card's name
 * small above. A linear barcode stretches across the whole width, the long side when the phone is turned. A tap or
 * Back closes it; it adds no history entry (Back closes a dialog first) and the screen stays bright under it.
 */
function openFull(card) {
  const format = drawnFormat(card);
  const result = encode(card.number, format);
  if (fullOpen || !result.ok) return;
  fullOpen = true;
  hideSnack();
  ctx.replace(cardHash(card, true), { quiet: true });
  const linear = result.symbol.linear;
  dialog(
    (close) => {
      const code = h("div", { class: "full-code" + (linear ? " linear" : "") });
      code.innerHTML = toSvg(result.symbol, format, {
        label: t("codeLabel", { store: card.store, number: card.number }),
      });
      // Bars may stretch: only their widths relative to each other carry the code.
      if (linear) code.firstElementChild.setAttribute("preserveAspectRatio", "none");
      const number = h("p", { class: "full-number", text: groupedNumber(card.number) });
      // The view itself takes the focus, so no close button is ringed as focused on the till's screen.
      const content = h(
        "div",
        { class: "full-body", tabindex: "-1", autofocus: true, onClick: () => close() },
        h("p", { class: "full-name", text: card.store }),
        code,
        number,
        button(t("close"), () => close(), "icon", { iconName: "close", extraClass: "full-close" }),
      );
      requestAnimationFrame(() => fitLine(number));
      return content;
    },
    { full: true, extraClass: "till-full", label: card.store },
  ).then(() => {
    fullOpen = false;
    if (location.hash === cardHash(card, true)) ctx.replace(cardHash(card), { quiet: true });
  });
}

// ---------------------------------------------------------------- the details under the code

function infoRow(label, value, extra) {
  return h(
    "div",
    { class: "info-row" },
    h("span", { class: "info-label", text: label }),
    h("span", { class: "info-value", text: value }),
    extra || null,
  );
}

function photoSlot(card, side) {
  const store = ctx.store;
  const slot = h("div", { class: "photo-slot" });
  const title = side === "face" ? t("front") : t("backSide");
  if (store.hasPhoto(side, card.id)) {
    const thumb = h("button", {
      type: "button",
      class: "photo-thumb",
      "aria-label": `${t("photoOf", { store: card.store })}: ${title}`,
    });
    store.photo(side, card.id).then((photo) => {
      if (!photo) return;
      thumb.appendChild(h("img", { src: `data:${photo.type};base64,${photo.b64}`, alt: "" }));
      thumb.onclick = () => showPhoto(card, side, photo, title);
    });
    slot.append(h("span", { class: "photo-title", text: title }), thumb);
    return slot;
  }
  const add = async (how) => {
    try {
      let file;
      if (how === "camera") file = await takePhoto();
      else file = ((await pickPictures({ multiple: false })) || [])[0];
      if (!file) return;
      const picture = await shrink(file, { side: 1100, crop: true });
      await store.setPhoto(side, card.id, picture);
    } catch (error) {
      showProblem(error);
    }
  };
  const camera = canTakePhoto();
  const picker = canPickPictures() || !store.live;
  const lower = side === "face" ? t("frontSide") : t("backSideLower");
  const choose = () => {
    // Both ways open from a tap: straight away when there is one, from a short choice when there are two.
    if (camera && !picker) return add("camera");
    if (picker && !camera) return add("pick");
    if (!camera && !picker) return snack(t("picturesUnavailable"));
    dialog(
      (close) =>
        h(
          "div",
          { class: "menu", role: "menu" },
          h(
            "button",
            { type: "button", class: "menu-item", onClick: () => (close(), add("camera")) },
            icon("camera"),
            h("span", { text: t("takePhoto") }),
          ),
          h(
            "button",
            { type: "button", class: "menu-item", onClick: () => (close(), add("pick")) },
            icon("image"),
            h("span", { text: t("pickPhoto") }),
          ),
        ),
      { sheet: true, label: t("addPhotoOf", { side: lower }) },
    );
  };
  slot.append(
    h("span", { class: "photo-title", text: title }),
    h(
      "button",
      { type: "button", class: "photo-add", onClick: choose, "aria-label": t("addPhotoOf", { side: lower }) },
      icon(camera ? "camera" : "image"),
      h("span", { text: t("addPhoto") }),
    ),
  );
  return slot;
}

function showPhoto(card, side, photo, title) {
  dialog(
    (close) =>
      h(
        "div",
        { class: "photo-view" },
        h(
          "div",
          { class: "sheet-head" },
          h("h2", { class: "sheet-title", text: `${card.store}: ${title}` }),
          button(t("close"), () => close(), "icon", { iconName: "close" }),
        ),
        h("img", { src: `data:${photo.type};base64,${photo.b64}`, alt: t("photoOf", { store: card.store }) }),
        h(
          "div",
          { class: "ask-buttons" },
          button(
            t("removePhoto"),
            async () => {
              close();
              await ctx.store.deletePhoto(side, card.id);
            },
            "text",
            { iconName: "trash" },
          ),
        ),
      ),
    { full: true, label: title },
  );
}

function details(card) {
  const day = today();
  const expired = card.expires && card.expires < day;
  const box = h("div", { class: "card-details" });
  if (state && state.dim && ctx.store.live) {
    box.appendChild(
      button(
        t("brighter"),
        () => ctx.store.run("showCode", { card: card.id, format: drawnFormat(card) }).catch(showProblem),
        "tonal",
        { iconName: "sun", extraClass: "wide" },
      ),
    );
  }
  const rows = h("div", { class: "info" });
  if (card.points !== undefined && card.points !== null)
    rows.appendChild(infoRow(t("pointsBalance"), formatNumber(card.points)));
  if (card.expires) {
    rows.appendChild(
      infoRow(
        expired ? t("expiredBadge") : t("validUntil"),
        expired ? t("expiredOn", { date: formatDate(card.expires) }) : formatDate(card.expires),
      ),
    );
  }
  if (card.holder) rows.appendChild(infoRow(t("nameCard"), card.holder));
  if (card.note)
    rows.appendChild(
      h(
        "div",
        { class: "info-note" },
        h("span", { class: "info-label", text: t("note") }),
        h("p", { class: "note-text", text: card.note }),
      ),
    );
  if (rows.childNodes.length) box.appendChild(rows);

  box.appendChild(h("h2", { class: "section-title", text: t("photos") }));
  box.appendChild(h("div", { class: "photos" }, photoSlot(card, "face"), photoSlot(card, "back")));

  const format = drawnFormat(card);
  const formatName = format === "qr" ? t("qrCode") : FORMAT_NAMES[format];
  const more = h(
    "details",
    { class: "more-details" },
    h("summary", { text: t("details") }),
    infoRow(
      t("barcodeType"),
      card.format && card.format !== "auto" ? formatName : t("workedOut", { format: formatName }),
    ),
    infoRow(t("kindShop"), t("kind_" + (card.group || "storefront"))),
    h("p", { class: "info-line", text: card.uses ? t("shown", { n: card.uses }) : t("notShownYet") }),
    card.lastUsed ? h("p", { class: "info-line", text: t("lastShown", { date: formatDate(card.lastUsed) }) }) : null,
  );
  box.appendChild(more);
  box.appendChild(
    h(
      "div",
      { class: "card-actions" },
      button(t("edit"), () => ctx.go("#/edit/" + encodeURIComponent(card.id)), "tonal", { iconName: "edit" }),
      button(t("shareCard"), () => shareCard(card), "tonal", { iconName: "share" }),
    ),
  );
  return box;
}

// ---------------------------------------------------------------- actions

/** The code as a PNG picture with the store and number under it, for sharing. */
function codePicture(card) {
  const format = drawnFormat(card);
  const result = encode(card.number, format);
  if (!result.ok) return null;
  const s = result.symbol;
  const quiet = FORMATS[format].quiet;
  const unit = Math.max(2, Math.floor(900 / (s.columns + quiet * 2)));
  const codeH = s.linear ? Math.round((s.columns + quiet * 2) * unit * 0.35) : s.height * unit;
  const width = (s.columns + quiet * 2) * unit;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = codeH + quiet * unit * (s.linear ? 0 : 2) + 140;
  const g = canvas.getContext("2d");
  g.fillStyle = "#fff";
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = "#000";
  const top = s.linear ? 40 : quiet * unit;
  for (let r = 0; r < s.rows; r++) {
    for (let c = 0; c < s.columns; c++) {
      if (!s.isDark(c, r)) continue;
      const y = s.linear ? top : top + r * s.rowHeight * unit;
      g.fillRect((c + quiet) * unit, y, unit, s.linear ? codeH : s.rowHeight * unit);
    }
  }
  g.font = "600 40px system-ui, sans-serif";
  g.textAlign = "center";
  g.fillText(card.number, width / 2, top + codeH + (s.linear ? 50 : quiet * unit + 10));
  g.font = "400 30px system-ui, sans-serif";
  g.fillText(card.store, width / 2, top + codeH + (s.linear ? 92 : quiet * unit + 52));
  return canvas;
}

let shared = null;

async function shareCard(card) {
  const zapli = ctx.zapli;
  const text = t("shareText", { store: card.store, number: card.number });
  if (!zapli || !zapli.share) {
    if (navigator.share) navigator.share({ title: card.store, text }).catch(() => {});
    else snack(t("onPhoneOnly"));
    return;
  }
  try {
    // The same File object on a second tap: its upload is kept, so the share goes out at once.
    if (!shared || shared.id !== card.id || shared.number !== card.number) {
      const canvas = codePicture(card);
      const blob = canvas ? await new Promise((resolve) => canvas.toBlob(resolve, "image/png")) : null;
      shared = {
        id: card.id,
        number: card.number,
        file: blob ? new File([blob], "card.png", { type: "image/png" }) : null,
      };
    }
    await zapli.share({ title: card.store, text, files: shared.file ? [shared.file] : undefined });
  } catch (error) {
    showProblem(error);
  }
}

async function toggleFavourite(card) {
  try {
    await ctx.store.update(card.id, { pinned: !card.pinned });
  } catch (error) {
    showProblem(error);
  }
}

function openMenu(card) {
  dialog(
    (close) => {
      const item = (label, iconName, run, danger) =>
        h(
          "button",
          {
            type: "button",
            class: "menu-item" + (danger ? " danger" : ""),
            onClick: () => {
              close();
              run();
            },
          },
          icon(iconName),
          h("span", { text: label }),
        );
      return h(
        "div",
        { class: "menu", role: "menu" },
        item(t("edit"), "edit", () => ctx.go("#/edit/" + encodeURIComponent(card.id))),
        item(t("shareCard"), "share", () => shareCard(card)),
        // Moving here works without dragging, for screen readers and anyone who cannot hold and drag.
        card.archived ? null : item(t("moveUp"), "chevronUp", () => moveHere(card, -1)),
        card.archived ? null : item(t("moveDown"), "chevronDown", () => moveHere(card, 1)),
        card.archived
          ? item(t("unarchive"), "unarchive", async () => {
              await ctx.store.update(card.id, { archived: false });
              snack(t("cardRestored"));
            })
          : item(t("archive"), "archive", async () => {
              await ctx.store.update(card.id, { archived: true });
              snack(t("cardArchived"), { label: t("undo"), run: () => ctx.store.update(card.id, { archived: false }) });
              ctx.back();
            }),
        item(t("delete"), "trash", () => deleteCard(card), true),
      );
    },
    { sheet: true, label: card.store },
  );
}

/** Moves the card in the wallet's order and shows the cards around it in their new order. */
async function moveHere(card, delta) {
  if (await moveCard(card.id, delta)) ctx.replace("#/card/" + encodeURIComponent(card.id));
  else snack(delta < 0 ? t("alreadyFirst") : t("alreadyLast"));
}

async function deleteCard(card) {
  const yes = await confirmDialog({
    title: t("deleteTitle", { store: card.store }),
    body: t("deleteBody"),
    yes: t("delete"),
    danger: true,
  });
  if (!yes) return;
  const store = ctx.store;
  const photos = {};
  for (const side of ["face", "back"])
    if (store.hasPhoto(side, card.id)) photos[side] = await store.photo(side, card.id);
  try {
    await store.remove(card.id);
  } catch (error) {
    showProblem(error);
    return;
  }
  ctx.back();
  snack(t("cardDeleted"), {
    label: t("undo"),
    run: async () => {
      const again = await store.add(card);
      for (const [side, picture] of Object.entries(photos)) if (picture) await store.setPhoto(side, again.id, picture);
    },
  });
}

// ---------------------------------------------------------------- the screen

function current() {
  return state ? state.cards[state.index] : null;
}

function paintTop() {
  const card = current();
  if (!card || !state.top) return;
  state.top.querySelector(".topbar-title").textContent = card.store;
  // A toggle: its name stays "Favourite" and its pressed state says whether the card is one. The name is text inside
  // the button, which is where the phone's screen reader looks for a toggle button's name.
  const star = state.top.querySelector(".star-toggle");
  star.replaceChildren(
    icon("star", { filled: Boolean(card.pinned) }),
    h("span", { class: "unseen", text: t("favouriteMark") }),
  );
  star.setAttribute("aria-pressed", card.pinned ? "true" : "false");
  star.classList.toggle("on", Boolean(card.pinned));
  state.position.textContent = state.cards.length > 1 ? t("cardOf", { i: state.index + 1, n: state.cards.length }) : "";
}

function paintDetails() {
  const card = current();
  if (!card) return;
  state.details.replaceChildren(details(card));
  fitNames(state.details);
}

/** The card on show changed by a swipe: its title, details and address follow; it counts as shown after a moment. */
function settle(index) {
  if (!state || index === state.index || index < 0 || index >= state.cards.length) return;
  state.index = index;
  const card = current();
  ctx.replace("#/card/" + encodeURIComponent(card.id), { quiet: true });
  drawCodes();
  paintTop();
  paintDetails();
  countLater(card);
  if (!ctx.store.ui.swiped) ctx.store.saveUi({ swiped: true });
  if (state.hint) state.hint.remove();
}

function countLater(card) {
  clearTimeout(state.usedTimer);
  if (state.counted.has(card.id)) return;
  state.usedTimer = setTimeout(() => {
    if (!state || current() !== card) return;
    state.counted.add(card.id);
    ctx.store.markUsed(card.id);
  }, USED_AFTER_MS);
}

/** The cards a swipe goes through: the wallet's, in its order, or the card alone when it is archived. */
function cardsAround(card) {
  const store = ctx.store;
  return card.archived ? [card] : orderedCards(store.cards, store.ui.order, store.ui.manual);
}

function render(route) {
  const store = ctx.store;
  const card = store.card(route.id);
  const screen = h("div", { class: "screen card-screen" });
  if (!card) {
    screen.appendChild(topBar({ title: t("appName"), onBack: () => ctx.back() }));
    screen.appendChild(h("div", { class: "empty" }, h("p", { text: t("somethingWrong") })));
    state = null;
    return screen;
  }
  const cards = cardsAround(card);
  const index = Math.max(
    0,
    cards.findIndex((c) => c.id === card.id),
  );
  const previous = state;
  state = {
    cards,
    // Which cards were favourites when the slides were laid out: a change of these reorders them.
    pinned: cards.map((c) => Boolean(c.pinned)),
    index,
    counted: previous && previous.counted ? previous.counted : new Set(),
    usedTimer: 0,
    dim: previous ? previous.dim : false,
  };
  const star = h("button", {
    type: "button",
    class: "btn icon star-toggle",
    "aria-pressed": "false",
    onClick: () => toggleFavourite(current()),
  });
  state.top = topBar({
    title: card.store,
    onBack: () => ctx.back(),
    actions: [star, button(t("menu"), () => openMenu(current()), "icon", { iconName: "more" })],
  });
  state.slides = h("div", { class: "slides", tabindex: "-1" }, cards.map(slide));
  state.position = h("p", { class: "position", "aria-live": "polite" });
  state.details = h("div", { class: "details-host" });
  state.hint = !store.ui.swiped && cards.length > 1 ? h("p", { class: "swipe-hint", text: t("swipeHint") }) : null;
  let scrollTimer = 0;
  state.slides.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const width = state.slides.clientWidth || 1;
      settle(Math.round(state.slides.scrollLeft / width));
    }, 90);
  });
  screen.append(
    state.top,
    h("div", { class: "till" }, state.slides, h("div", { class: "under-code" }, state.position, state.hint)),
    state.details,
  );
  paintTop();
  paintDetails();
  return screen;
}

function mounted(route) {
  if (!state) return;
  const width = state.slides.clientWidth;
  state.slides.scrollLeft = state.index * width;
  drawCodes();
  fitNames(document.getElementById("main"));
  brighten(true);
  countLater(current());
  if (route && route.params.get("full") === "1") openFull(current());
}

/**
 * A change of data (a use counted, a photo, a favourite): the details and the title follow. A card made a favourite
 * here, or no longer one, moves in the wallet's order, so the slides take the new order at once with the card still
 * on show. A use counted moves nothing while the cards show, so the slides never change under the finger.
 */
function refresh() {
  if (!state) return;
  const store = ctx.store;
  const card = current() && store.card(current().id);
  if (!card) return;
  const starred = state.cards.some((c, i) => {
    const now = store.card(c.id);
    return now && Boolean(now.pinned) !== state.pinned[i];
  });
  if (starred) {
    state.cards = cardsAround(card);

  if (state) clearTimeout(state.usedTimer);

const settings = modules["js/screens/settings.mjs"];

  [/^add$/, add],

  [/^edit\/(.+)$/, edit],
  [/^settings$/, settings],

    const match = pattern.exec(clean);

        path: clean,
        id: match[1] || null,
        params: new URLSearchParams(query),
        name: clean.split("/")[0],

// lie above the wallet (`depth`), so the phone's Back goes one screen back and leaves the app from the wallet. Entries
// are added during a tap: Chromium lets Back skip an entry a page added before it was first touched. A screen reached
// after the scanner or the photo picker (no tap any more) takes the place of the one that opened them instead.

// behind it. At start, the way there is laid down again (the wallet, then each screen above it), so Back still goes

}

/** Shows a screen in the place of this one (after the scanner or a picker, or a swipe to the next card). */
function replace(hash, { quiet = false } = {}) {
  const stack = currentStack();
  const target = parseRoute(hash);
  if (!quiet) leaveCurrent(target);
  history.replaceState({ stack: [...stack.slice(0, -1), hash], depth: depth() }, "", hash);
  if (!quiet) render();
}

/** The back arrow: the same step as the phone's Back; without an entry below, the screen's parent takes its place. */
function back() {
  hideSnack();
  if (depth() > 0) {
    ownStep = true;
    history.back();
    return;
  }
  const stack = currentStack();
  const next = stack.length > 1 ? stack.slice(0, -1) : ["#/"];
  leaveCurrent(parseRoute(next[next.length - 1]));
  history.replaceState({ stack: next, depth: 0 }, "", next[next.length - 1]);
  render();
}

function leaveCurrent(target) {
  if (current && current.screen.leave && current.screen !== target.screen) current.screen.leave();
}

function onPopState() {
  if (ownStep) ownStep = false;
  else hideSnack();
  const target = parseRoute(location.hash);
  leaveCurrent(target);
  render();
}

// ---------------------------------------------------------------- drawing

/** Draws the screen of the current hash; `again` is a redraw after a change of data. */
function render(again = false) {
  const route = parseRoute(location.hash);
  const same = Boolean(current && current.path === route.path);
  if (again && same && route.screen.refresh) {
    route.screen.refresh(route);
    return;
  }
  if (again && same && route.screen.keep) return;
  const y = same ? window.scrollY : scrolls.get(route.path) || 0;
  current = route;
  let node;
  try {
    node = route.screen.render(route);
  } catch (error) {
    console.error(error);
    node = h(
      "div",
      { class: "empty" },
      h("h2", { text: t("somethingWrong") }),
      h("p", { text: String(error && error.message) }),
    );
  }
  main.textContent = "";
  main.appendChild(node);
  if (route.screen.mounted) route.screen.mounted(route);
  document.title = t("appName");
  window.scrollTo(0, y);
  if (!same) main.focus({ preventScroll: true });
}

/** How much larger than normal the phone draws text, so faces and grids make room at large text sizes. */
function measureTextScale() {
  const probe = h("span", {
    style: { position: "absolute", visibility: "hidden", fontSize: "16px", lineHeight: "1" },
    text: "M",
  });
  document.body.appendChild(probe);
  const scale = probe.getBoundingClientRect().height / 16 || 1;
  probe.remove();
  document.documentElement.classList.toggle("big-text", scale >= 1.45);
  document.documentElement.classList.toggle("huge-text", scale >= 1.8);
}

function applyLanguage() {
  let phone = navigator.language || "en";
  try {
    if (ctx.zapli && ctx.zapli.app && ctx.zapli.app.locale) phone = ctx.zapli.app.locale() || phone;
  } catch {
    // The browser's language is good enough.
  }
  ctx.lang = pickLanguage(store.ui.lang, phone);
  ctx.locale = ctx.lang === "sk" ? "sk-SK" : String(phone).startsWith("en") ? phone : "en-GB";
  ctx.t = translator(ctx.lang);
  ctx.country = store.ui.country && store.ui.country !== "auto" ? store.ui.country : countryFor(phone);
  document.documentElement.lang = ctx.lang;
}

async function start() {
  ctx.store = store;
  ctx.go = go;
  ctx.back = back;
  ctx.replace = replace;
  ctx.zapli = window.zapli || null;
  applyLanguage();
  main.appendChild(h("p", { class: "loading", role: "status", text: t("loading") }));
  try {
    await store.open();
  } catch (error) {
    console.error(error);
    main.textContent = "";
    main.appendChild(
      h(
        "div",
        { class: "empty" },
        h("h2", { text: t("couldNotLoad") }),
        h("p", { text: t("couldNotLoadHelp") }),
        h("button", { class: "btn filled", type: "button", text: t("tryAgain"), onClick: () => location.reload() }),
      ),
    );
    return;
  }
  applyLanguage();
  measureTextScale();
  followKeyboard();
  if (!history.state || !history.state.stack) layDownPath();
  store.on(() => {
    applyLanguage();
    render(true);
  });
  window.addEventListener("popstate", onPopState);
  window.addEventListener("resize", () => {
    measureTextScale();
    if (current && current.screen.resized) current.screen.resized();
  });
  // An address typed into a browser shows that screen in place of this one: no entry may be added without a tap.
  window.addEventListener("hashchange", () => {
    const stack = currentStack();
    if (location.hash !== stack[stack.length - 1]) replace(location.hash || "#/");
  });
  if (ctx.zapli && ctx.zapli.app) {
    ctx.zapli.app.on("pause", () => current && current.screen.paused && current.screen.paused());
    ctx.zapli.app.on("resume", () => current && current.screen.resumed && current.screen.resumed());
  }
  document.addEventListener("visibilitychange", () => {
    if (!current) return;
    if (document.visibilityState === "hidden" && current.screen.paused) current.screen.paused();
    if (document.visibilityState === "visible" && current.screen.resumed) current.screen.resumed();
  });
  render();
  if (!store.live) document.body.classList.add("preview");
}

start();
  return { parseRoute };
})();
    </script>
    </body>
</html>
