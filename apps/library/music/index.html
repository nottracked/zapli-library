            }

            /* ---------- routes: #/ songs, #/albums, #/artists, #/album/<key>, #/artist/<key>, #/search, #/now, #/queue ---------- */
            function route() {
                const h = location.hash.replace(/^#\/?/, "");
                const i = h.indexOf("/");
                const name = (i < 0 ? h : h.slice(0, i)) || "songs";
                let key = null;
                if (i >= 0) {
                    try {
                        key = decodeURIComponent(h.slice(i + 1));
                    } catch {
                        key = null;
                    }
                }
                return { name, key };
            }
            const depth = () => (history.state && history.state.d) || 0;
            function go(path) {
                history.pushState({ d: depth() + 1 }, "", "#/" + path);
                render();
            }
            function back() {
                if (depth() > 0) history.back();
                else {
                    history.replaceState({ d: 0 }, "", tab === "songs" ? "#/" : "#/" + tab);
                    render();
                }
            }
            let underlay = ""; // the screen under the player: a tab name, or "album", "artist", "search"
            let underlayRoute = null;
            function render(force) {
                const r = route();
                const ready = appState === "ready";
                el.tabbar.hidden = !ready;
                if (!ready) {
                    setNowOpen(false);
                    setQueueOpen(false);
                    el.sub.hidden = true;
                    el.lib.classList.remove("off");
                    el.lib.inert = false;
                    el.libBody.removeAttribute("role");
                    el.libBody.dataset.tab = "";
                    el.libBody.innerHTML = stateHtml(appState);
                    if (appState === "loading") paintLoading();
                    updateMini();
                    return;
                }
                const overlay = r.name === "now" || r.name === "queue";
                if (overlay && !(ps && ps.queue && ps.queue.length)) {
                    history.replaceState({ d: 0 }, "", "#/");
                    return render(force);
                }
                if (overlay) {
                    if (!underlay || force) showBase(underlayRoute || { name: "songs", key: null }, force);
                    setNowOpen(true);
                    setQueueOpen(r.name === "queue");
                } else {
                    setQueueOpen(false);
                    setNowOpen(false);
                    showBase(r, force);
                }
                updateMini();
            }
            function showBase(r, force) {
                if (
                    ["songs", "albums", "artists"].includes(r.name) ||
                    !["album", "artist", "search"].includes(r.name)
                ) {
                    const name = ["albums", "artists"].includes(r.name) ? r.name : "songs";
                    el.sub.hidden = true;
                    el.lib.classList.remove("off");
                    el.lib.inert = false;
                    if (force || el.libBody.dataset.tab !== name) {
                        showTab(name, force && name === tab);
                        el.libBody.dataset.tab = name;
                    }
                    underlay = name;
                    underlayRoute = { name, key: null };
                    subKey = "";
                    return;
                }
                const key = r.name + ":" + (r.key || "");
                el.lib.classList.add("off");
                el.lib.inert = true;
                el.sub.hidden = false;
                underlay = r.name;
                underlayRoute = r;
                if (key === subKey && !force) return;
                subKey = key;
                if (r.name === "album") {
                    const a = lib.albumByKey.get(r.key);
                    if (!a) return back();
                    renderAlbum(a);
                } else if (r.name === "artist") {
                    const a = lib.artistByKey.get(r.key);
                    if (!a) return back();
                    renderArtist(a);
                } else renderSearch();
                el.sub.scrollTop = 0;
            }
            el.sub.addEventListener(
                "scroll",
                () => {
                    const top = $("#subtop");
                    if (top) top.classList.toggle("scrolled", el.sub.scrollTop > 140);
                },
                { passive: true },
            );

            /* ---------- the player: what the page shows of Zapli's one player ---------- */
            const curSong = () => {
                const id = curId();
                return id && lib ? lib.byId.get(id) || null : null;
            };
            function curDuration() {
                if (ps && ps.owner && ps.duration) return ps.duration;
                const s = curSong();
                return (s && s.duration) || (ps && ps.duration) || 0;
            }
            function livePos() {
                if (!ps || !ps.queue) return 0;
                if (!ps.owner && pendingSeek != null) return pendingSeek;
                let p = ps.position || 0;
                if (ps.owner && ps.status === "playing" && ps.measuredAt)
                    p += Math.max(0, Date.now() - ps.measuredAt) * (ps.speed || 1);
                const d = curDuration();
                return d ? Math.min(p, d) : p;
            }
            const isPlaying = () => !!(ps && ps.owner && (ps.status === "playing" || ps.status === "buffering"));
            let wasOwner = false;
            function applyState(s, quiet) {
                if (!s) return;
                const prev = ps;
                ps = s;
                if (s.owner) pendingSeek = null;
                if (!quiet && wasOwner && !s.owner && prev && prev.status === "playing") toast(t("otherApp"));
                wasOwner = !!s.owner;
                const changed = !prev || curIdOf(prev) !== curId() || quiet;
                document.body.classList.toggle("playing", isPlaying() && s.status === "playing");
                updateMini(changed);
                updateNow(changed, prev);
                markCurrent();
                if (el.queue.classList.contains("open")) renderQueue(false);
                if (!(s.queue && s.queue.length) && /^#\/(now|queue)/.test(location.hash)) back();
                kick();
            }
            const curIdOf = (s) => (s && s.queue && s.queue.length ? s.track || s.queue[s.index || 0] : null);
            function markCurrent() {
                const id = curId();
                for (const r of $$(".row.cur")) if (r.dataset.id !== id) r.classList.remove("cur");
                if (id) for (const r of $$(`.row[data-id="${id}"]`)) r.classList.add("cur");
                for (const r of $$("#queue .row"))
                    r.classList.toggle("cur", ps && Number(r.dataset.i) === (ps.index || 0));
            }
            function ppState(btn) {
                const waiting = ps && ps.owner && ps.status === "buffering";

            function updateMini(changed) {
                const show =
                    appState === "ready" && !!(ps && ps.queue && ps.queue.length) && !el.now.classList.contains("open");
                el.mini.classList.toggle("show", show);
                el.mini.inert = !show;
                document.body.classList.toggle("has-mini", show);
                requestAnimationFrame(() =>
                    document.documentElement.style.setProperty(
                        "--mini-h",
                        show ? el.mini.offsetHeight + 12 + "px" : "0px",
                    ),
                );
                if (!ps || !ps.queue) return;
                const s = curSong();
                if (changed) {
                    $("#mTitle").textContent = s ? s.title : "…";
                    $("#mArtist").textContent = s ? songArtist(s) : "";
                    const box = $("#mArt");
                    box.innerHTML = MARK;
                    box.className = "art";
                    box.removeAttribute("data-seen");
                    if (s) {
                        box.setAttribute("style", artFor(s.ak).style);

                        "aria-label",

            function updateNow(changed, prev) {
                if (!ps || !ps.queue) return;
                const s = curSong();
                if (changed) {
                    $("#npTitle").textContent = s ? s.title : "…";
                    $("#npArtist").textContent = s ? songArtist(s) : "";
                    let dir = 0;
                    if (Date.now() - skipAt < 2500) dir = skipDir;
                    else if (prev && prev.queue && typeof prev.index === "number" && typeof ps.index === "number")
                        dir = ps.index === prev.index + 1 ? 1 : ps.index === prev.index - 1 ? -1 : 0;
                    skipAt = 0;
                    setNowCover(s, prev ? dir : null);
                    el.seek.max = String(Math.max(1000, curDuration()));
                }
                ppState($("#npPlay"));
                const sh = $("#xShuffle");
                sh.setAttribute("aria-pressed", String(!!ps.shuffle));
                const rep = ps.repeat || "off";
                const rb = $("#xRepeat");
                rb.classList.toggle("on", rep !== "off");
                rb.innerHTML =
                    icon(rep === "one" ? "repeatOne" : "repeat") +
                    `<span aria-hidden="true">${esc(t(rep === "one" ? "repeatOne" : rep === "all" ? "repeatAll" : "repeatOff"))}</span>`;
                rb.setAttribute(
                    "aria-label",
                    t("repeatSay", {
                        v: t(rep === "one" ? "repeatOneSay" : rep === "all" ? "repeatAllSay" : "repeatOffSay"),
                    }),
                );
                const sp = $("#xSpeed");
                const speed = ps.speed || 1;
                sp.classList.toggle("on", speed !== 1);
                sp.innerHTML =
                    icon("speed") +
                    `<span aria-hidden="true">${esc(speed === 1 ? t("speed") : speedText(speed))}</span>`;
                sp.setAttribute("aria-label", t("speedSay", { v: speed === 1 ? t("normal") : speedText(speed) }));
                paintSleep();
            }
            let sleepShown = "";
            function paintSleep() {
                const b = $("#xSleep");
                const sl = ps && ps.owner ? ps.sleep : null;
                let label = t("sleep"),
                    say = t("sleepNone");
                if (sl && sl.endOfTrack) {
                    label = t("endShort");
                    say = t("sleepEnd");
                } else if (sl && sl.at) {
                    label = minutesText(Math.max(0, sl.at - Date.now()));
                    say = t("sleepIn", { t: label });
                }
                const key = label + "|" + !!sl;
                if (key === sleepShown) return;
                sleepShown = key;
                b.classList.toggle("on", !!sl);
                b.innerHTML = icon("moon") + `<span aria-hidden="true">${esc(label)}</span>`;
                b.setAttribute("aria-label", t("sleepSay", { v: say }));
            }
            function setNowCover(s, dir) {
                const box = $("#npCover");
                const old = $$(".art", box);
                const node = document.createElement("span");
                const a = s ? artFor(s.ak) : art("none");
                node.className = "art xl";
                node.setAttribute("style", a.style);
                node.innerHTML = MARK;
                const motion = dir !== null && !reduceMotion() && el.now.classList.contains("open");
                const kind = dir > 0 ? "next" : dir < 0 ? "prev" : "fade";
                if (motion) node.classList.add("enter-" + kind);
                box.append(node);
                for (const o of old) {
                    o.classList.remove("drag");
                    o.style.transform = "";
                    if (motion) {
                        o.classList.add("leave-" + kind);
                        setTimeout(() => o.remove(), 480);
                    } else o.remove();
                }
                if (motion)
                    requestAnimationFrame(() => requestAnimationFrame(() => node.classList.remove("enter-" + kind)));
                tintNow(a.hues);
                if (!s) return;
                node.dataset.cv = s.id;
                node.dataset.seen = "1";
                coverUrl(s, 512).then((url) => {
                    if (!node.isConnected) return;
                    paintArt(node, url, (h) => {
                        if (node.isConnected && h) tintNow(h);
                        else if (node.isConnected && !h) tintNow(null);
                    });
                });
            }

            /* the position: computed from the state's position, measuredAt and speed, drawn every frame while visible */
            let raf = 0,
                dragging = false,
                lastSecond = -1;
            function needsLoop() {
                return (
                    isPlaying() &&
                    !document.hidden &&
                    (el.now.classList.contains("open") || el.mini.classList.contains("show"))
                );
            }
            function kick() {
                paint();
                if (!raf && needsLoop()) raf = requestAnimationFrame(loop);
            }
            function loop() {
                raf = 0;
                paint();
                if (needsLoop()) raf = requestAnimationFrame(loop);
            }
            function paint() {
                if (!ps || !ps.queue) return;
                const d = curDuration(),
                    p = livePos();
                const f = d ? Math.min(1, p / d) : 0;
                $("#mBar").style.transform = `scaleX(${f})`;
                if (!el.now.classList.contains("open")) return;
                if (!dragging) {
                    el.seek.value = String(Math.round(p));
                    el.seek.style.setProperty("--p", f * 100 + "%");
                }
                const sec = Math.floor((dragging ? Number(el.seek.value) : p) / 1000);
                if (sec !== lastSecond) {
                    lastSecond = sec;
                    const shown = dragging ? Number(el.seek.value) : p;
                    $("#tNow").textContent = clock(shown);
                    $("#tAll").textContent = clock(d);
                    el.seek.setAttribute("aria-valuetext", t("timeOf", { a: clock(shown), b: clock(d) }));
                    paintSleep();
                }
            }
            el.seek.addEventListener("input", () => {
                dragging = true;
                const d = curDuration();
                el.seek.style.setProperty("--p", (d ? (Number(el.seek.value) / d) * 100 : 0) + "%");
                lastSecond = -1;
                paint();
            });
            el.seek.addEventListener("change", () => {
                const v = Math.round(Number(el.seek.value));
                dragging = false;
                if (!ps || !ps.queue) return;
                if (ps.owner) {
                    // Show the new place at once; the player's own state follows.
                    ps = { ...ps, position: v, measuredAt: Date.now() };
                    call(M.seek(v));
                } else pendingSeek = v;
                lastSecond = -1;
                kick();
            });
            document.addEventListener("visibilitychange", kick);
            if (window.matchMedia) {
                const scheme = matchMedia("(prefers-color-scheme: dark)");
                if (scheme.addEventListener) scheme.addEventListener("change", () => tintNow(lastHues));
            }

            /* ---------- what the buttons do; the calls that need a tap are made right in the tap ---------- */
            function call(p) {
                return Promise.resolve(p).catch(failed);
            }
            function failed(e) {
                const code = e && e.code;
                if (code === "PERMISSION_DENIED" || code === "OS_DENIED") checkAccess();
                else if (code === "NEEDS_GESTURE") toast(t("tapAgain"));
                else if (code === "RATE_LIMITED") toast(t("tooFast"));
                else if (code === "NOT_FOUND") {
                    toast(t(ps && ps.owner ? "gone" : "tapSong"));
                    loadLibrary(true);
                } else toast(t("failed"));
            }
            function playFrom(l, i) {
                const ids = lists[l];
                if (!ids || !ids.length) return;
                let q = ids,
                    idx = Math.max(0, Math.min(i, ids.length - 1));
                if (ids.length > 1000) {
                    const start = Math.max(0, Math.min(idx - 100, ids.length - 1000));
                    q = ids.slice(start, start + 1000);
                    idx -= start;
                }
                call(M.play(q, { index: idx, position: 0 }));
            }
            function toggle() {
                if (!ps || !ps.queue) return;
                if (isPlaying()) return call(M.pause());
                if (!ps.owner && pendingSeek != null) {
                    const at = pendingSeek;
                    pendingSeek = null;
                    return call(M.play(ps.queue, { index: ps.index || 0, position: at }));
                }
                call(M.resume());
            }
            function step(dir) {
                if (!ps || !ps.queue) return;
                skipDir = dir;
                skipAt = Date.now();
                if (ps.owner) return call(M.skip(dir > 0 ? "next" : "previous"));
                const len = ps.queue.length;
                let i = (ps.index || 0) + dir;
                if (i < 0) i = 0;
                if (i >= len) i = 0;
                call(M.play(ps.queue, { index: i }));
            }
            function setNowOpen(open) {
                const was = el.now.classList.contains("open");
                if (open === was) return;
                el.now.classList.toggle("open", open);
                el.now.inert = !open;
                document.body.classList.toggle("now-open", open);
                el.lib.inert = open || el.lib.classList.contains("off");
                el.sub.inert = open;
                if (open) {
                    updateNow(true, null);
                    lastSecond = -1;
                    setTimeout(() => $("#npClose").focus({ preventScroll: true }), 60);
                } else if (ps && ps.queue && ps.queue.length)
                    setTimeout(() => $("#mOpen").focus({ preventScroll: true }), 60);
                updateMini();
                kick();
            }
            function setQueueOpen(open) {
                const was = el.queue.classList.contains("open");
                if (open === was) return;
                el.queue.classList.toggle("open", open);
                el.queue.inert = !open;
                if (open) {
                    renderQueue(true);
                    setTimeout(() => {
                        const b = $("#queue [data-act=back]");
                        if (b) b.focus({ preventScroll: true });
                    }, 60);
                }
            }
            function renderQueue(scroll) {
                if (!ps || !ps.queue) return;
                const q = ps.queue;
                const top = el.queue.scrollTop;
                const rows = q
                    .map((id, i) => {
                        const s = (lib && lib.byId.get(id)) || { id, title: "…", ar: "", ak: id };
                        const cur = i === (ps.index || 0) ? " cur" : "";
                        return `<li><button class="row${cur}" data-act="qplay" data-i="${i}" data-id="${esc(id)}">${artHtml(s, "sm")}<span class="txt"><span class="t1">${esc(s.title)}</span><span class="t2">${esc(songArtist(s))}<span class="nowlbl vh">, ${esc(t("playingNow"))}</span></span></span>${s.duration ? `<span class="dur">${clock(s.duration)}</span>` : ""}${EQ}</button></li>`;
                    })
                    .join("");
                const note = ps.shuffle
                    ? `<p class="note">${icon("shuffle")}<span>${esc(t("shuffleNote"))}</span></p>`
                    : "";
                el.queue.innerHTML = `<header class="subtop scrolled"><button class="icon-btn" data-act="back" aria-label="${esc(t("back"))}">${icon("back")}</button><h2 class="st" id="qTitle">${esc(t("upNext"))}</h2></header>${note}<p class="count">${esc(tn("songCount", q.length))}</p><ol class="rows">${rows}</ol>`;
                observeArts(el.queue);
                if (scroll) {
                    const c = $("#queue .row.cur");
                    if (c) c.scrollIntoView({ block: "center" });
                } else el.queue.scrollTop = top;
            }

            /* sheets: speed, sleep timer and the letter jump */
            function sheet(title, body, sub = "") {
                el.sheet.innerHTML = `<div class="sheetin"><div class="sheethead"><h2 id="sheetTitle">${esc(title)}</h2><button class="icon-btn round-btn" data-act="closeSheet" aria-label="${esc(t("close"))}">${icon("close")}</button></div>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}${body}</div>`;
                el.sheet.setAttribute("aria-labelledby", "sheetTitle");
                if (!el.sheet.open) {
                    try {
                        el.sheet.showModal();
                    } catch {
                        el.sheet.setAttribute("open", "");
                    }
                }
                const pressed = $('[aria-pressed="true"]', el.sheet) || $(".opt", el.sheet);
                if (pressed) setTimeout(() => pressed.focus(), 30);
            }
            function closeSheet() {
                if (el.sheet.open) el.sheet.close();
            }
            el.sheet.addEventListener("click", (e) => {
                if (e.target === el.sheet) closeSheet();
            });
            function speedSheet() {
                const cur = (ps && ps.speed) || 1;
                const opts = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2]
                    .map(
                        (v) =>
                            `<button class="opt" data-act="setSpeed" data-v="${v}" aria-pressed="${v === cur}">${v === cur ? icon("check") : ""}<span>${esc(v === 1 ? `${speedText(1)} ${t("normal")}` : speedText(v))}</span></button>`,
                    )
                    .join("");
                sheet(t("speedTitle"), `<div class="opts">${opts}</div>`, t("speedHint"));
            }
            function sleepSheet() {
                const owner = !!(ps && ps.owner);
                const sl = owner ? ps.sleep : null;
                const dis = owner ? "" : " disabled";
                const label = (m) =>
                    m < 60
                        ? tn("minutes", m)
                        : m % 60
                          ? `${tn("hours", Math.floor(m / 60))} ${tn("minutes", m % 60)}`
                          : tn("hours", m / 60);
                const opts = [5, 10, 15, 30, 45, 60, 90, 120]
                    .map((m) => `<button class="opt" data-act="setSleep" data-v="${m}"${dis}>${esc(label(m))}</button>`)
                    .join("");
                let status = "";
                if (sl)
                    status = `<p class="note">${icon("moon")}<span>${esc(sl.endOfTrack ? t("sleepEnd") : t("sleepIn", { t: minutesText(sl.at - Date.now()) }))}</span></p>`;
                else if (!owner) status = `<p class="note">${icon("info")}<span>${esc(t("sleepNeedsPlay"))}</span></p>`;
                const end = `<button class="opt" data-act="setSleepEnd" aria-pressed="${!!(sl && sl.endOfTrack)}"${dis}>${icon("note")}<span>${esc(t("endOfSong"))}</span></button>`;
                const off = sl
                    ? `<button class="opt danger" data-act="sleepOff">${icon("close")}<span>${esc(t("sleepOff"))}</span></button>`
                    : "";
                sheet(
                    t("sleepTitle"),
                    `${status}<div class="opts">${opts}</div><div class="opts wide">${end}${off}</div>`,
                    t("sleepHint"),
                );
            }
            function lettersSheet() {
                const btns = songGroups
                    .map((g, i) => `<button class="opt" data-act="jump" data-v="${i}">${esc(g.key)}</button>`)
                    .join("");
                sheet(t("letters"), `<div class="letters">${btns}</div>`);
            }

            /* ---------- access ---------- */
            // afterRead: reading the songs was just refused, so "granted" here means something is off: show the error.
            async function checkAccess(afterRead) {
                let status;
                try {
                    status = await M.access();
                } catch {
                    status = "error";
                }
                if (afterRead && status === "granted") setAppState("error");
                else afterAccess(status);
            }
            function afterAccess(status) {
                if (status === "granted") {
                    if (appState !== "ready") loadLibrary(false);
                } else if (status === "denied") setAppState("denied");
                else if (status === "osDenied") setAppState("osDenied");
                else if (status === "notAsked") setAppState("welcome");
                else setAppState("error");
            }
            function findMusic() {
                // Called right in the tap: Zapli asks only from a tap.
                call(
                    M.requestAccess().then((status) => {
                        if (status === "notAsked") {
                            welcomeNote = t("welcomeAgain");
                            setAppState("welcome");
                        } else afterAccess(status);
                    }),
                );
            }

            document.addEventListener("click", (e) => {
                const b = e.target.closest("[data-act]");
                if (!b || b.disabled) return;
                const d = b.dataset;
                switch (d.act) {
                    case "tab":
                        if (tab !== d.tab || route().name !== d.tab) {
                            history.replaceState(history.state, "", d.tab === "songs" ? "#/" : "#/" + d.tab);
                            el.libBody.dataset.tab = "";
                            showTab(d.tab);
                            el.libBody.dataset.tab = d.tab;
                            underlay = d.tab;
                            underlayRoute = { name: d.tab, key: null };
                        }
                        break;
                    case "search":
                        go("search");
                        break;
                    case "back":
                        back();
                        break;
                    case "album":
                        go("album/" + encodeURIComponent(d.k));
                        break;
                    case "artist":
                        go("artist/" + encodeURIComponent(d.k));
                        break;
                    case "play":
                        playFrom(d.l, Number(d.i));
                        break;
                    case "playAll":
                        if (ps && ps.shuffle) call(M.set({ shuffle: false }));
                        playFrom(d.l, 0);
                        break;
                    case "shuffleAll": {
                        if (!ps || !ps.shuffle) call(M.set({ shuffle: true }));
                        const n = (lists[d.l] || []).length;
                        playFrom(d.l, Math.floor(Math.random() * n));
                        break;
                    }
                    case "letters":
                        renderTab.flush();
                        lettersSheet();
                        break;
                    case "jump": {
                        closeSheet();
                        const h = document.getElementById("sec-" + d.v);
                        if (h) {
                            h.scrollIntoView({ block: "start" });
                            const btn = $("button", h);
                            if (btn) btn.focus({ preventScroll: true });
                        }
                        break;
                    }
                    case "openNow":
                        go("now");
                        break;
                    case "closeNow":
                        back();
                        break;
                    case "toggle":
                        toggle();
                        break;
                    case "next":
                        step(1);
                        break;
                    case "prev":
                        step(-1);
                        break;
                    case "shuffle":
                        if (ps) call(M.set({ shuffle: !ps.shuffle }));
                        break;
                    case "repeat":
                        if (ps) call(M.set({ repeat: { off: "all", all: "one", one: "off" }[ps.repeat || "off"] }));
                        break;
                    case "speed":
                        speedSheet();
                        break;
                    case "setSpeed":
                        call(M.set({ speed: Number(d.v) }));
                        closeSheet();
                        break;
                    case "sleep":
                        sleepSheet();
                        break;
                    case "setSleep":
                        call(M.sleep({ minutes: Number(d.v) }));
                        closeSheet();
                        break;
                    case "setSleepEnd":
                        call(M.sleep({ endOfTrack: true }));
                        closeSheet();
                        break;
                    case "sleepOff":
                        call(M.cancelSleep());
                        closeSheet();
                        break;
                    case "closeSheet":
                        closeSheet();
                        break;
                    case "queue":
                        if (route().name !== "queue") go("queue");
                        break;
                    case "qplay": {
                        const i = Number(d.i);
                        if (ps && ps.owner) call(M.skip({ index: i }));
                        else if (ps && ps.queue) call(M.play(ps.queue, { index: i }));
                        break;
                    }
                    case "find":
                        findMusic();
                        break;
                    case "settings":
                        if (Z && Z.ui && typeof Z.ui.openSettings === "function") call(Z.ui.openSettings());
                        else toast(t("demoOnly"));
                        break;
                    case "recheck":
                        if (DEMO) toast(t("demoOnly"));
                        else checkAccess();
                        break;
                    case "retry":
                        if (DEMO && demoPreview) toast(t("demoOnly"));
                        else loadLibrary(false);
                        break;
                    case "demo":
                        demoPreview = "";
                        startDemo(true);
                        break;
                    case "clearSearch": {
                        const q = $("#q");
                        if (q) {
                            q.value = "";
                            runSearch();
                            q.focus();
                        }
                        break;
                    }
                }
            });
            window.addEventListener("popstate", () => render());
            window.addEventListener("hashchange", () => render());
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && el.queue.classList.contains("open") && !el.sheet.open) back();
                else if (e.key === "Escape" && el.now.classList.contains("open") && !el.sheet.open) back();
            });

            /* swipe the big cover sideways to skip a song */
            (() => {
                const wrap = $("#coverWrap");
                let x0 = 0,
                    y0 = 0,
                    id = null,
                    axis = "",
                    t0 = 0;
                const front = () => {
                    const all = $$("#npCover .art");
                    return all[all.length - 1];
                };
                wrap.addEventListener("pointerdown", (e) => {
                    if (!ps || !ps.queue) return;
                    id = e.pointerId;
                    x0 = e.clientX;
                    y0 = e.clientY;
                    axis = "";
                    t0 = performance.now();
                });
                wrap.addEventListener("pointermove", (e) => {
                    if (e.pointerId !== id) return;
                    const dx = e.clientX - x0,
                        dy = e.clientY - y0;
                    if (!axis && Math.hypot(dx, dy) > 10) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
                    if (axis === "x" && !reduceMotion()) {
                        const f = front();
                        if (f) {
                            f.classList.add("drag");
                            f.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
                        }
                    }
                });
                const end = (e) => {
                    if (e.pointerId !== id) return;
                    id = null;
                    const dx = e.clientX - x0;
                    const fast = Math.abs(dx) / Math.max(1, performance.now() - t0) > 0.5;
                    const f = front();
                    if (axis === "x" && (Math.abs(dx) > 80 || (fast && Math.abs(dx) > 30)) && e.type === "pointerup") {
                        step(dx < 0 ? 1 : -1);
                        // Back to its place if no other song comes (the skip failed, or it was the only song).
                        setTimeout(() => {
                            if (f && f.isConnected && f.classList.contains("drag")) {
                                f.classList.remove("drag");
                                f.style.transform = "";
                            }
                        }, 1500);
                    } else if (f) {
                        f.classList.remove("drag");
                        f.style.transform = "";
                    }
                    axis = "";
                };
                wrap.addEventListener("pointerup", end);
                wrap.addEventListener("pointercancel", end);
            })();

            /* ---------- toasts ---------- */
            let toastTimer = 0;
            function toast(text) {
                el.toast.textContent = text;
                el.toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.toast.classList.remove("show"), 3800);
            }

            /* ---------- start ---------- */
            // Large text (150 % or more of the usual size): the page drops a few extras to keep words readable.
            function measureText() {
                const px = $("#remProbe").offsetWidth / 10 || 16;
                document.documentElement.classList.toggle("big", px >= 24);
            }
            measureText();
            if ("ResizeObserver" in window) new ResizeObserver(measureText).observe($("#remProbe"));
            for (const ev of ["DOMContentLoaded", "load", "resize"]) window.addEventListener(ev, measureText);
            function labelStatic() {
                $("#logo").innerHTML = icon("note");
                const sb = $("#searchBtn");
                sb.innerHTML = icon("search");
                sb.setAttribute("aria-label", t("search"));
                for (const b of $$(".tab", el.tabs)) b.textContent = t(b.dataset.tab);
                $("#mPlay").innerHTML = PP_ICONS;
                $("#npPlay").innerHTML = PP_ICONS;
                const n = $("#mNext");
                n.innerHTML = icon("next");
                n.setAttribute("aria-label", t("next"));
                $("#npClose").innerHTML = icon("down");
                $("#npClose").setAttribute("aria-label", t("closePlayer"));
                $("#npQueueTop").innerHTML = icon("queue");
                $("#npQueueTop").setAttribute("aria-label", t("upNext"));
                $("#npPrev").innerHTML = icon("prev");
                $("#npPrev").setAttribute("aria-label", t("previous"));
                $("#npNext").innerHTML = icon("next");
                $("#npNext").setAttribute("aria-label", t("next"));
                $("#xShuffle").innerHTML = icon("shuffle") + `<span>${esc(t("shuffle"))}</span>`;
                $("#xQueue").innerHTML = icon("queue") + `<span>${esc(t("upNext"))}</span>`;
                $("#npLabel").textContent = t("nowPlaying");
                $("#npChip").textContent = t("demoChip");
                $("#npChipLine").hidden = !DEMO;
                el.seek.setAttribute("aria-label", t("seekLabel"));
                el.mini.setAttribute("aria-label", t("nowPlaying"));
                const bar = $("#demoBar");
                bar.hidden = !DEMO;
                if (DEMO)
                    bar.innerHTML = `${icon("info")}<span><b>${esc(t("demoTitle"))}</b>${esc(t("demoBody"))}</span>`;
                el.now.inert = true;
                el.queue.inert = true;
                el.mini.inert = true;
            }
            function listen() {
                try {
                    M.on("state", (s) => applyState(s));
                    M.on("library", () => loadLibrary(true));
                } catch {
                    /* an older Zapli without events: the state is read after each call instead */
                }
                M.state().then(
                    (s) => {
                        if (!ps) applyState(s, true);
                    },
                    () => null,
                );
            }
            let demoPreview = "";
            function startDemo(fromButton) {
                DEMO = true;
                M = demoMusic();
                const first = DEMO_TRACKS.filter((x) => x.albumId === DEMO_TRACKS[0].albumId).map((x) => x.id);
                M.remember(first, 2, 64000);
                labelStatic();
                listen();
                // ?state=welcome|denied|osDenied|empty|loading|error|unsupported shows that screen, for screenshots.
                const preview = fromButton ? "" : new URLSearchParams(location.search).get("state") || "";
                if (/^(welcome|denied|osDenied|empty|loading|error|unsupported)$/.test(preview)) {
                    demoPreview = preview;
                    if (preview === "loading") loadProgress = { n: 500, total: 1240 };
                    setAppState(preview);
                    if (preview === "welcome") demoPreview = "";
                    return;
                }
                loadLibrary(false);
            }
            async function start() {
                if (!history.state) history.replaceState({ d: 0 }, "", location.hash || "#/");
                const r = route();
                if (["albums", "artists"].includes(r.name)) tab = r.name;
                if (!Z) return startDemo();
                labelStatic();
                await Z.ready.catch(() => null);
                if (!has("music.tracks") || !Z.music) {
                    setAppState("unsupported");
                    return;
                }
                M = Z.music;
                listen();
                try {
                    Z.app.on("resume", () => {
                        if (["welcome", "denied", "osDenied"].includes(appState)) checkAccess();
                        kick();
                    });
                    Z.app.on("pause", () => {
                        cancelAnimationFrame(raf);
                        raf = 0;
                    });
                } catch {
                    /* an older Zapli */
                }
                checkAccess();
            }
            if ("ResizeObserver" in window) {
                const sizes = new ResizeObserver(() => {
                    const show = el.mini.classList.contains("show");
                    document.documentElement.style.setProperty(
                        "--mini-h",
                        show ? el.mini.offsetHeight + 12 + "px" : "0px",
                    );
                    document.documentElement.style.setProperty("--tabs-h", el.tabbar.offsetHeight + 8 + "px");
                });
                sizes.observe(el.mini);
                sizes.observe(el.tabbar);
            }
            start();
        </script>
    </body>
</html>
