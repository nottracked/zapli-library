            @property --npa {
                syntax: "<color>";
                inherits: true;
                initial-value: #f4a6cf;
            }
            :root {
                color-scheme: light dark;
                --bg: #fbf6f9;
                --surface: #ffffff;
                --surface-2: #f3e9f0;
                --ink: #1d1420;
                --muted: #5b4e60;
                --line: #e6d9e2;
                --accent: var(--zapli-color-primary, #9e2b6b);
                --on-accent: var(--zapli-color-on-primary, #ffffff);
                --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
                --demo-bg: linear-gradient(120deg, #fff1c4, #ffe0ee);
                --demo-ink: #3b2a0c;
                --shadow: 0 1px 2px rgba(40, 10, 30, 0.08), 0 6px 18px rgba(40, 10, 30, 0.08);
                --shadow-lg: 0 18px 40px rgba(40, 10, 30, 0.26);
                --radius: 18px;
                --radius-s: 12px;
                --font: var(--zapli-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
                --tap: clamp(48px, 3rem, 64px);
                --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
                --mini-h: 0px;
                --np-ink: #1a1220;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #140f15;
                    --surface: #1f1820;
                    --surface-2: #2c222d;
                    --ink: #f6eef4;
                    --muted: #c3b6c1;
                    --line: #3a2f3b;
                    --accent: var(--zapli-color-primary, #f39bc9);
                    --on-accent: var(--zapli-color-on-primary, #4a0d2e);
                    --demo-bg: linear-gradient(120deg, #3b3011, #3d1d2d);
                    --demo-ink: #ffeec2;
                    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.35);
                    --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.55);
                    --np-ink: #ffffff;
                }
            }
            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--ink);
                font: 400 1.125rem/1.45 var(--font);
                -webkit-tap-highlight-color: transparent;
                overflow: hidden;
            }
            button {
                font: inherit;
                color: inherit;
                background: none;
                border: 0;
                padding: 0;
                margin: 0;
                cursor: pointer;
                touch-action: manipulation;
            }
            button:disabled {
                cursor: default;
                opacity: 0.5;
            }
            :focus-visible {
                outline: 3px solid var(--accent);
                outline-offset: 2px;
            }
            svg {
                fill: currentColor;
                flex: none;
            }
            h1,
            h2,
            h3,
            p {
                margin: 0;
            }
            .vh {
                position: absolute !important;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }

            /* ---------- screens: each one scrolls by itself, so going back keeps the place in a list ---------- */
            .view {
                position: fixed;
                inset: 0;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                    calc(env(safe-area-inset-bottom, 0px) + var(--mini-h) + 1.5rem) env(safe-area-inset-left, 0px);
                background: var(--bg);
            }
            .view.off {
                visibility: hidden;
            }
            .top {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 1rem 0.75rem 0.75rem 1.25rem;
            }
            .brand {
                flex: 1;
                min-width: 0;
                font-size: clamp(28px, 1.875rem, 44px);
                font-weight: 800;
                letter-spacing: -0.01em;
                overflow-wrap: anywhere;
                display: flex;
                align-items: center;
                gap: 0.65rem;
            }
            .logo {
                width: clamp(40px, 2.6rem, 54px);
                height: clamp(40px, 2.6rem, 54px);
                border-radius: 13px;
                display: grid;
                place-items: center;
                background: linear-gradient(160deg, #b2367a, #8f2560);
                color: #fff;
                box-shadow: var(--shadow);
                flex: none;
            }
            .logo svg {
                width: 60%;
                height: 60%;
            }
            .icon-btn {
                min-width: var(--tap);
                min-height: var(--tap);
                border-radius: 999px;
                display: inline-grid;
                place-items: center;
                flex: none;
            }
            .icon-btn svg {
                width: clamp(24px, 1.65rem, 34px);
                height: clamp(24px, 1.65rem, 34px);
            }
            .icon-btn:active {
                background: var(--surface-2);
            }
            .round-btn {
                background: var(--surface-2);
            }
            .tabbar {
                position: sticky;
                top: 0;
                z-index: 5;
                display: flex;
                align-items: center;
                gap: 0.45rem;
                padding: 0.5rem 0.75rem 0.75rem 1rem;
                background: color-mix(in srgb, var(--bg) 90%, transparent);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
            }
            .tabs {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 0.45rem;
            }
            .tab {
                flex: 1 1 auto;
                min-height: var(--tap);
                padding: 0.45rem 0.9rem;
                border-radius: 999px;
                font-weight: 700;
                background: var(--surface-2);
                color: var(--muted);
                transition:
                    background 0.2s,
                    color 0.2s;
            }
            .tab[aria-selected="true"] {
                background: var(--accent);
                color: var(--on-accent);
                box-shadow: var(--shadow);
            }
            .demo {
                margin: 0 1rem 0.75rem;
                padding: 0.8rem 1rem;
                border-radius: 16px;
                background: var(--demo-bg);
                color: var(--demo-ink);
                font-size: 1rem;
                line-height: 1.4;
                display: flex;
                gap: 0.7rem;
                align-items: flex-start;
            }
            .demo svg {
                width: clamp(22px, 1.5rem, 30px);
                height: clamp(22px, 1.5rem, 30px);
                margin-top: 0.05rem;
            }
            .demo b {
                display: block;
            }

            /* ---------- lists ---------- */
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                padding: 0.25rem 1rem 0.5rem;
                align-items: center;
            }
            .pill {
                min-height: 3.25rem;
                padding: 0.55rem 1.25rem;
                border-radius: 999px;
                font-weight: 750;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                background: var(--surface-2);
                transition: transform 0.15s var(--ease);
            }
            .pill:active {
                transform: scale(0.97);
            }
            .pill svg {
                width: clamp(22px, 1.5rem, 32px);
                height: clamp(22px, 1.5rem, 32px);
            }
            .pill.primary {
                background: var(--accent);
                color: var(--on-accent);
                box-shadow: var(--shadow);
            }
            .count {
                color: var(--muted);
                font-size: 1rem;
                padding: 0.1rem 1.25rem 0.25rem;
            }
            .sec {
                content-visibility: auto;
                contain-intrinsic-size: auto 640px;
            }
            .sech {
                margin: 0.25rem 0 0;
                padding: 0 0.75rem;
                scroll-margin-top: var(--tabs-h, 4.5rem);
            }
            .sech button {
                min-width: var(--tap);
                min-height: var(--tap);
                padding: 0 0.6rem;
                border-radius: 12px;
                font-size: 1.3rem;
                font-weight: 800;
                color: var(--accent);
                text-align: left;
            }
            .rows {
                list-style: none;
                margin: 0;
                padding: 0 0.5rem;
            }
            .row {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 0.9rem;
                padding: 0.5rem 0.6rem;
                min-height: 4.5rem;
                border-radius: var(--radius-s);
                text-align: left;
                transition: background 0.2s;
            }
            .row:active {
                background: var(--surface-2);
            }
            .row.cur {
                background: var(--accent-soft);
            }
            .row.cur .t1 {
                color: var(--accent);
            }
            .txt {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 0.1rem;
            }
            .t1 {
                font-weight: 650;
                overflow-wrap: anywhere;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .t2 {
                color: var(--muted);
                font-size: 1rem;
                overflow-wrap: anywhere;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .dur {
                color: var(--muted);
                font-size: 0.95rem;
                font-variant-numeric: tabular-nums;
                flex: none;
            }
            .num {
                width: 2rem;
                text-align: center;
                color: var(--muted);
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                flex: none;
            }
            .row .nowlbl {
                display: none;
            }
            .row.cur .nowlbl {
                display: inline;
            }
            .eq {
                display: none;
                gap: 3px;
                align-items: flex-end;
                height: 1.1rem;
                width: 1.2rem;
                flex: none;
            }
            .row.cur .eq {
                display: inline-flex;
            }
            .eq i {
                width: 4px;
                border-radius: 2px;
                background: var(--accent);
                height: 45%;
            }
            .eq i:nth-child(2) {
                height: 85%;
                animation-delay: -0.45s;
            }
            .eq i:nth-child(3) {
                height: 60%;
                animation-delay: -0.75s;
            }
            body.playing .row.cur .eq i {
                animation: eq 0.9s ease-in-out infinite alternate;
            }
            @keyframes eq {
                from {
                    height: 22%;
                }
                to {
                    height: 100%;
                }
            }
            .chev {
                width: 1.6rem;
                height: 1.6rem;
                color: var(--muted);
            }

            /* ---------- covers: the song's own picture, or a tile drawn from its album's name ---------- */
            .art {
                position: relative;
                display: block;
                flex: none;
                overflow: hidden;
                border-radius: 10px;
                isolation: isolate;
            }
            .art {
                background: var(--art);
            }
            .art.nocover {
                background: var(--base);
            }
            .art img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: 0;
                transition: opacity 0.35s;
            }
            .art img.on {
                opacity: 1;
            }
            .art .mark {
                position: absolute;
                left: 24%;
                top: 24%;
                width: 52%;
                height: 52%;
                fill: rgba(255, 255, 255, 0.62);
                display: none;
            }
            .art.nocover .mark {
                display: block;
            }
            .art.sm {
                width: clamp(48px, 3.6rem, 72px);
                height: clamp(48px, 3.6rem, 72px);
            }
            .art.round {
                border-radius: 50%;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr));
                gap: 1.1rem 0.9rem;
                padding: 0.25rem 1rem 1rem;
            }
            .tile {
                display: flex;
                flex-direction: column;
                gap: 0.3rem;
                text-align: left;
                border-radius: var(--radius);
                min-width: 0;
            }
            .tile .art {
                width: 100%;
                aspect-ratio: 1;
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                transition: transform 0.2s var(--ease);
                margin-bottom: 0.25rem;
            }
            .tile:active .art {
                transform: scale(0.96);
            }
            .tile .t1 {
                font-size: 1.05rem;
            }
            .strip {
                display: flex;
                gap: 0.9rem;
                overflow-x: auto;
                padding: 0.25rem 1rem 1rem;
                scroll-snap-type: x proximity;
            }
            .strip .tile {
                width: 9.5rem;
                flex: none;
                scroll-snap-align: start;
            }
            .arow {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 0.9rem;
                padding: 0.5rem 0.6rem;
                min-height: 4.75rem;
                border-radius: var(--radius-s);
                text-align: left;
            }
            .arow:active {
                background: var(--surface-2);
            }
            .rh {
                font-size: 1.25rem;
                font-weight: 800;
                padding: 1rem 1.25rem 0.4rem;
            }

            /* ---------- album, artist and search screens ---------- */
            .subtop {
                position: sticky;
                top: 0;
                z-index: 5;
                display: flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.5rem 0.5rem;
                min-height: 4rem;
                background: color-mix(in srgb, var(--bg) 90%, transparent);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
            }
            .subtop:not(.scrolled) {
                background: transparent;
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }
            .subtop .st {
                flex: 1;
                min-width: 0;
                font-size: 1.15rem;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                opacity: 0;
                transition: opacity 0.2s;
            }
            .subtop.scrolled .st {
                opacity: 1;
            }
            .hero {
                position: relative;
                isolation: isolate;
                padding: 0.25rem 1.25rem 0.75rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 0.45rem;
            }
            .hero::before {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: -5rem;
                height: 24rem;
                background: radial-gradient(80% 65% at 50% 25%, var(--tint, transparent), transparent 72%);
                opacity: 0.5;
                z-index: -1;
                transition: background 0.6s;
            }
            .hero .art.xl {
                width: min(16rem, 68vw);
                aspect-ratio: 1;
                border-radius: 22px;
                box-shadow: var(--shadow-lg);
                margin-bottom: 0.5rem;
            }
            .hero h1 {
                font-size: 1.65rem;
                line-height: 1.2;
                overflow-wrap: anywhere;
            }
            .hero .by {
                font-size: 1.15rem;
                font-weight: 600;
                color: var(--accent);
            }
            .hero .meta2 {
                color: var(--muted);
                font-size: 1rem;
            }
            .hero .actions {
                justify-content: center;
                padding-top: 0.6rem;
            }
            .avatar {
                width: min(10rem, 45vw);
                height: min(10rem, 45vw);
                border-radius: 50%;
                box-shadow: var(--shadow-lg);
                margin-bottom: 0.5rem;
            }
            .searchbox {
                flex: 1;
                min-width: 0;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                min-height: 3.25rem;
                padding: 0 0.4rem 0 0.9rem;
                border-radius: 999px;
                background: var(--surface-2);
            }
            .searchbox:focus-within {
                outline: 3px solid var(--accent);
                outline-offset: -3px;
            }
            .searchbox svg {
                width: 1.5rem;
                height: 1.5rem;
                color: var(--muted);
            }
            .searchbox input {
                flex: 1;
                min-width: 0;
                min-height: 3rem;
                border: 0;
                background: transparent;
                font: inherit;
                color: inherit;
                outline: none;
            }
            .searchbox input::-webkit-search-cancel-button {
                -webkit-appearance: none;
            }
            .hint {
                color: var(--muted);
                padding: 1.5rem 1.5rem;
                text-align: center;
            }

            /* ---------- first run, permission, empty, loading and error states ---------- */
            .state {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 1rem;
                padding: 0.5rem 1.5rem 2rem;
                max-width: 34rem;
                margin: 0 auto;
            }
            .state h2 {
                font-size: 1.65rem;
                line-height: 1.25;
            }
            .state p {
                color: var(--muted);
            }
            .state .lead {
                color: var(--ink);
                font-size: 1.2rem;
            }
            .state .steps {
                text-align: left;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                padding: 1rem 1.1rem;
                display: flex;
                gap: 0.8rem;
                align-items: flex-start;
                color: var(--ink);
            }
            .state .steps svg {
                width: 1.75rem;
                height: 1.75rem;
                color: var(--accent);
                margin-top: 0.1rem;
            }
            .big {
                width: 100%;
                min-height: 4.25rem;
                padding: 0.75rem 1.5rem;
                border-radius: 999px;
                font-size: 1.35rem;
                font-weight: 800;
                background: var(--accent);
                color: var(--on-accent);
                box-shadow: var(--shadow-lg);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
                transition: transform 0.15s var(--ease);
            }
            .big:active {
                transform: scale(0.98);
            }
            .big svg {
                width: clamp(26px, 1.9rem, 38px);
                height: clamp(26px, 1.9rem, 38px);
            }
            .big.quiet {
                background: var(--surface-2);
                color: var(--ink);
                box-shadow: none;
                font-size: 1.2rem;
                min-height: 3.5rem;
            }
            .illo {
                width: min(15rem, 66vw);
                height: auto;
                margin-top: 0.5rem;
            }
            .float {
                animation: float 3.2s ease-in-out infinite alternate;
            }
            .float.b {
                animation-delay: -1.6s;
            }
            @keyframes float {
                from {
                    transform: translateY(4px);
                }
                to {
                    transform: translateY(-8px);
                }
            }
            .spin {
                transform-origin: 120px 92px;
                animation: spin 2.4s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .bar {
                width: 100%;
                height: 10px;
                border-radius: 99px;
                background: var(--surface-2);
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                width: 0;
                background: var(--accent);
                border-radius: 99px;
                transition: width 0.3s;
            }

            /* ---------- the mini player on the library screens ---------- */
            .mini {
                position: fixed;
                left: max(0.6rem, env(safe-area-inset-left, 0px));
                right: max(0.6rem, env(safe-area-inset-right, 0px));
                bottom: calc(env(safe-area-inset-bottom, 0px) + 0.6rem);
                z-index: 20;
                display: flex;
                align-items: center;
                gap: 0.2rem;
                padding: 0.5rem 0.4rem 0.45rem 0.5rem;
                border-radius: 22px;
                background: var(--surface);
                border: 1px solid var(--line);
                box-shadow: var(--shadow-lg);
                overflow: hidden;
                max-width: 44rem;
                margin: 0 auto;
                transform: translateY(160%);
                visibility: hidden;
                transition:
                    transform 0.38s var(--ease),
                    visibility 0s 0.38s;
            }
            .mini.show {
                transform: none;
                visibility: visible;
                transition:
                    transform 0.38s var(--ease),
                    visibility 0s;
            }
            .mprog {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 4px;
                background: var(--line);
            }
            .mprog i {
                display: block;
                height: 100%;
                background: var(--accent);
                transform-origin: left;
                transform: scaleX(0);
            }
            .mopen {
                flex: 1;
                min-width: 0;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                text-align: left;
                min-height: var(--tap);
                border-radius: 14px;
                padding-right: 0.25rem;
            }
            .mini .art {
                width: clamp(48px, 3.4rem, 64px);
                height: clamp(48px, 3.4rem, 64px);
                border-radius: 12px;
            }
            .mini .t1 {
                -webkit-line-clamp: 1;
            }
            .mini .t2 {
                -webkit-line-clamp: 1;
            }
            .mplay {
                width: clamp(52px, 3.5rem, 64px);
                height: clamp(52px, 3.5rem, 64px);
                background: var(--accent);
                color: var(--on-accent);
            }
            .mplay:active {
                background: var(--accent);
                transform: scale(0.95);
            }

            /* play and pause in one button; a ring while the player is getting ready */
            .pp .i-pause,
            .pp .i-wait {
                display: none;
            }
            .pp.is-playing .i-play {
                display: none;
            }
            .pp.is-playing .i-pause {
                display: block;
            }
            .pp.is-waiting .i-play,
            .pp.is-waiting .i-pause {
                display: none;
            }
            .pp.is-waiting .i-wait {
                display: block;
                animation: spin2 1s linear infinite;
            }
            @keyframes spin2 {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ---------- now playing ---------- */
            .now {
                position: fixed;
                inset: 0;
                z-index: 40;
                color: var(--np-ink);
                background:
                    radial-gradient(
                        110% 60% at 15% 0%,
                        color-mix(in srgb, var(--npa) 35%, transparent),
                        transparent 70%
                    ),
                    radial-gradient(130% 75% at 50% 0%, var(--np1), var(--np2));
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                transform: translateY(100%);
                visibility: hidden;
                transition:
                    transform 0.42s var(--ease),
                    visibility 0s 0.42s,
                    --np1 0.9s ease,
                    --np2 0.9s ease,
                    --npa 0.9s ease;
            }
            .now.open {
                transform: none;
                visibility: visible;
                transition:
                    transform 0.42s var(--ease),
                    visibility 0s,
                    --np1 0.9s ease,
                    --np2 0.9s ease,
                    --npa 0.9s ease;
            }
            .glowbox {
                position: absolute;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }
            .glow {
                position: absolute;
                width: 70vmax;
                height: 70vmax;
                border-radius: 50%;
                pointer-events: none;
                background: radial-gradient(closest-side, color-mix(in srgb, var(--npa) 26%, transparent), transparent);
                right: -30vmax;
                bottom: -25vmax;
                animation: drift 18s ease-in-out infinite alternate;
            }
            @keyframes drift {
                to {
                    transform: translate(-12vmax, -10vmax) scale(1.15);
                }
            }
            .nowin {
                position: relative;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                gap: 0.9rem;
                max-width: 40rem;
                margin: 0 auto;
                padding: calc(env(safe-area-inset-top, 0px) + 0.4rem) calc(env(safe-area-inset-right, 0px) + 1.25rem)
                    calc(env(safe-area-inset-bottom, 0px) + 1.25rem) calc(env(safe-area-inset-left, 0px) + 1.25rem);
            }
            .nowtop {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin: 0 -0.5rem;
            }
            .nowtop .icon-btn:active {
                background: color-mix(in srgb, var(--np-ink) 14%, transparent);
            }
            .nowlabel {
                flex: 1;
                text-align: center;
                font-weight: 750;
                font-size: 0.95rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                opacity: 0.85;
            }
            .chipline {
                text-align: center;
                margin-top: -0.6rem;
            }
            .chip {
                display: inline-block;
                font-size: 0.85rem;
                font-weight: 700;
                letter-spacing: 0;
                text-transform: none;
                padding: 0.15rem 0.6rem;
                border-radius: 99px;
                background: color-mix(in srgb, var(--np-ink) 14%, transparent);
            }
            .coverwrap {
                flex: 1 1 auto;
                display: grid;
                place-items: center;
                min-height: 0;
                touch-action: pan-y;
                padding: 0.25rem 0;
            }
            .cover {
                position: relative;
                width: min(100%, 46vh, 27rem);
                aspect-ratio: 1;
            }
            .cover .art {
                position: absolute;
                inset: 0;
                border-radius: 28px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
                transition:
                    transform 0.45s var(--ease),
                    opacity 0.45s;
            }
            .cover .art.enter-next {
                transform: translateX(60%) scale(0.85);
                opacity: 0;
            }
            .cover .art.enter-prev {
                transform: translateX(-60%) scale(0.85);
                opacity: 0;
            }
            .cover .art.enter-fade {
                transform: scale(0.92);
                opacity: 0;
            }
            .cover .art.leave-next {
                transform: translateX(-60%) scale(0.85);
                opacity: 0;
            }
            .cover .art.leave-prev {
                transform: translateX(60%) scale(0.85);
                opacity: 0;
            }
            .cover .art.leave-fade {
                opacity: 0;
            }
            .cover .art.drag {
                transition: none;
            }
            .nowctl {
                display: flex;
                flex-direction: column;
                gap: 0.9rem;
            }
            .meta {
                text-align: center;
            }
            .meta h2 {
                font-size: 1.6rem;
                line-height: 1.25;
                overflow-wrap: anywhere;
            }
            .meta p {
                margin-top: 0.3rem;
                font-size: 1.2rem;
                opacity: 0.85;
                overflow-wrap: anywhere;
            }
            .seek input {
                width: 100%;
                height: var(--tap);
                -webkit-appearance: none;
                appearance: none;
                background: transparent;
                margin: 0;
                --p: 0%;
            }
            .seek input::-webkit-slider-runnable-track {
                height: 8px;
                border-radius: 99px;
                background: linear-gradient(
                    to right,
                    var(--npa) var(--p),
                    color-mix(in srgb, var(--np-ink) 24%, transparent) var(--p)
                );
            }
            .seek input::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 28px;
                height: 28px;
                margin-top: -10px;
                border-radius: 50%;
                background: var(--npa);
                border: 4px solid var(--np1);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            .seek input::-moz-range-track {
                height: 8px;
                border-radius: 99px;
                background: color-mix(in srgb, var(--np-ink) 24%, transparent);
            }
            .seek input::-moz-range-progress {
                height: 8px;
                border-radius: 99px;
                background: var(--npa);
            }
            .seek input::-moz-range-thumb {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: var(--npa);
                border: 4px solid var(--np1);
            }
            .seek input:focus-visible {
                outline: 3px solid var(--np-ink);
                outline-offset: 4px;
                border-radius: 8px;
            }
            .times {
                display: flex;
                justify-content: space-between;
                font-variant-numeric: tabular-nums;
                font-size: 1rem;
                font-weight: 600;
                opacity: 0.85;
                margin-top: -0.3rem;
            }
            .controls {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: clamp(0.75rem, 7vw, 2.25rem);
            }
            .ctl {
                width: clamp(60px, 4.25rem, 80px);
                height: clamp(60px, 4.25rem, 80px);
                border-radius: 50%;
                display: grid;
                place-items: center;
                transition: transform 0.15s var(--ease);
            }
            .ctl svg {
                width: clamp(34px, 2.5rem, 46px);
                height: clamp(34px, 2.5rem, 46px);
            }
            .ctl:active {
                background: color-mix(in srgb, var(--np-ink) 14%, transparent);
                transform: scale(0.94);
            }
            .ctl.main {
                width: clamp(80px, 5.75rem, 104px);
                height: clamp(80px, 5.75rem, 104px);
                background: var(--npa);
                color: var(--np1);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            }
            .ctl.main svg {
                width: clamp(42px, 3rem, 54px);
                height: clamp(42px, 3rem, 54px);
            }
            .extras {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.25rem;
                margin: 0 -0.5rem;
            }
            .xbtn {
                flex: 1 1 3.9rem;
                max-width: 7.5rem;
                min-height: 4.4rem;
                padding: 0.45rem 0.3rem;
                border-radius: 18px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.2rem;
                font-size: 0.95rem;
                font-weight: 650;
                line-height: 1.2;
                text-align: center;
                transition:
                    background 0.25s,
                    color 0.25s;
            }
            .xbtn svg {
                width: clamp(24px, 1.7rem, 34px);
                height: clamp(24px, 1.7rem, 34px);
            }
            .xbtn:active {
                background: color-mix(in srgb, var(--np-ink) 14%, transparent);
            }
            .xbtn.on,
            .xbtn[aria-pressed="true"] {
                background: var(--npa);
                color: var(--np1);
            }

            /* ---------- up next ---------- */
            .qpanel {
                position: fixed;
                inset: 0;
                z-index: 50;
                background: var(--bg);
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                    calc(env(safe-area-inset-bottom, 0px) + 1.5rem) env(safe-area-inset-left, 0px);
                transform: translateX(100%);
                visibility: hidden;
                transition:
                    transform 0.36s var(--ease),
                    visibility 0s 0.36s;
            }
            .qpanel.open {
                transform: none;
                visibility: visible;
                transition:
                    transform 0.36s var(--ease),
                    visibility 0s;
            }
            .qpanel .subtop .st {
                opacity: 1;
                font-size: 1.3rem;
            }
            .note {
                margin: 0.25rem 1rem 0.5rem;
                padding: 0.8rem 1rem;
                border-radius: 14px;
                background: var(--surface-2);
                color: var(--ink);
                font-size: 1rem;
                display: flex;
                gap: 0.6rem;
                align-items: flex-start;
            }
            .note svg {
                width: 1.4rem;
                height: 1.4rem;
                color: var(--accent);
            }

            /* ---------- sheets (speed, sleep timer, letters) ---------- */
            dialog.sheet {
                position: fixed;
                inset: auto 0 0 0;
                margin: 0 auto;
                width: 100%;
                max-width: 40rem;
                max-height: 90%;
                border: 0;
                padding: 0;
                background: transparent;
                color: var(--ink);
                overflow: visible;
            }
            dialog.sheet::backdrop {
                background: rgba(12, 6, 12, 0.55);
            }
            .sheetin {
                background: var(--surface);
                border-radius: 26px 26px 0 0;
                padding: 0.75rem 1.25rem calc(env(safe-area-inset-bottom, 0px) + 1.25rem);
                max-height: 90vh;
                overflow-y: auto;
                animation: up 0.32s var(--ease);
            }
            @keyframes up {
                from {
                    transform: translateY(40%);
                    opacity: 0;
                }
            }
            .sheethead {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .sheethead h2 {
                flex: 1;
                font-size: 1.4rem;
            }
            .sheet p.sub {
                color: var(--muted);
                margin-top: 0.25rem;
            }
            .opts {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 7.5rem), 1fr));
                gap: 0.6rem;
                margin-top: 1rem;
            }
            .opts.wide {
                grid-template-columns: 1fr;
            }
            .opt {
                min-height: 3.6rem;
                padding: 0.5rem 0.75rem;
                border-radius: 16px;
                background: var(--surface-2);
                font-weight: 700;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }
            .opt svg {
                width: 1.4rem;
                height: 1.4rem;
            }
            .opt[aria-pressed="true"] {
                background: var(--accent);
                color: var(--on-accent);
            }
            .opt.danger {
                background: transparent;
                border: 2px solid var(--line);
            }
            .letters {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(3.5rem, 1fr));
                gap: 0.5rem;
                margin-top: 1rem;
            }
            .letters .opt {
                font-size: 1.3rem;
                min-height: 3.5rem;
            }

            .toast {
                position: fixed;
                left: 50%;
                bottom: calc(env(safe-area-inset-bottom, 0px) + var(--mini-h) + 1.5rem);
                z-index: 70;
                transform: translate(-50%, 1rem);
                opacity: 0;
                max-width: min(92vw, 30rem);
                width: max-content;
                padding: 0.85rem 1.15rem;
                border-radius: 14px;
                background: var(--ink);
                color: var(--bg);
                font-weight: 650;
                text-align: center;
                pointer-events: none;
                transition:
                    opacity 0.25s,
                    transform 0.25s var(--ease);
            }
            .toast.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            body.now-open .toast {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
            }

            /* the phone's largest text sizes: room for the words first */
            html.big .mini .art,
            html.big .row .dur {
                display: none;
            }
            html.big .mini .t1,
            html.big .mini .t2 {
                -webkit-line-clamp: 2;
            }
            html.big .row .t1 {
                -webkit-line-clamp: 3;
            }
            html.big .row .art.sm,
            html.big .arow .art.sm {
                width: 44px;
                height: 44px;
            }
            html.big .row,
            html.big .arow {
                gap: 0.6rem;
            }
            html.big .tabbar {
                position: static;
            }
            html.big .nowlabel {
                font-size: 0.75rem;
                letter-spacing: 0.02em;
            }
            html.big .demo {
                font-size: 0.85rem;
            }
            html.big .demo svg {
                display: none;
            }

            /* sideways on a phone: the cover beside the controls */
            @media (orientation: landscape) and (min-width: 560px) and (max-height: 600px) {
                .nowin {
                    display: grid;
                    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
                    grid-template-rows: auto auto 1fr;
                    column-gap: 2rem;
                    row-gap: 0.4rem;
                    max-width: 64rem;
                }
                .nowtop,
                .chipline {
                    grid-column: 1 / -1;
                }
                .chipline {
                    grid-row: 2;
                    margin: 0;
                }
                .coverwrap {
                    grid-row: 3;
                }
                .nowctl {
                    grid-row: 3;
                    align-self: center;
                    gap: 0.4rem;
                }
                .cover {
                    width: min(100%, 66vh);
                }
                .meta h2 {
                    font-size: 1.35rem;
                }
                .xbtn {
                    min-height: 3.6rem;
                    padding: 0.25rem;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }
        </style>
    </head>

                        settle();
                        s.status = "paused";
                        schedule();
                        emit();
                    },
                    async resume() {
                        if (!s.queue) throw zerr("NOT_FOUND");
                        settle();
                        if (s.status === "ended") s.position = 0;
                        s.owner = true;
                        s.status = "playing";
                        s.measuredAt = Date.now();
                        schedule();
                        emit();
                    },
                    async seek(position) {
                        need();
                        s.position = Math.max(0, Math.min(position, dur(cur())));
                        s.measuredAt = Date.now();
                        if (s.status === "ended") s.status = "paused";
                        schedule();
                        emit();
                    },
                    async skip(to) {
                        need();
                        settle();
                        if (to && typeof to === "object") s.index = Math.min(to.index, s.queue.length - 1);
                        else if (to === "next") {
                            const n = advance();
                            s.index = n === null ? 0 : n;
                        } else if (s.position < 3000) s.index = Math.max(0, s.index - 1);
                        s.position = 0;
                        s.measuredAt = Date.now();
                        if (s.status === "ended") s.status = "playing";
                        schedule();
                        emit();
                    },
                    async set(o) {
                        settle();
                        if ("shuffle" in o) s.shuffle = !!o.shuffle;
                        if ("repeat" in o) s.repeat = o.repeat;
                        if ("speed" in o) s.speed = o.speed;
                        schedule();
                        emit();
                    },
                    async sleep(o) {
                        need();
                        clearTimeout(sleepTimer);
                        if (o.minutes) {
                            s.sleep = { at: Date.now() + o.minutes * 60000 };
                            sleepTimer = setTimeout(() => {
                                settle();
                                s.status = "paused";
                                s.sleep = null;
                                schedule();
                                emit();
                            }, o.minutes * 60000);
                        } else s.sleep = { endOfTrack: true };
                        emit();
                    },
                    async cancelSleep() {
                        clearTimeout(sleepTimer);
                        s.sleep = null;
                        emit();
                    },
                    state: async () => snapshot(),
                    on(event, fn) {
                        listeners[event].add(fn);
                        if (event === "state") setTimeout(() => fn(snapshot()), 0);
                        return () => listeners[event].delete(fn);
                    },
                    // Where a listener left off last time: the third song of the first album, a minute in.
                    remember(queue, index, position) {
                        Object.assign(s, {
                            queue,
                            index,
                            position,
                            owner: false,
                            status: "idle",
                            measuredAt: Date.now(),
                        });
                    },
                };
            }

            /* ---------- state ---------- */
            let M = null; // zapli.music, or the demo's stand-in
            let DEMO = false;
            let appState = "start"; // start | welcome | denied | osDenied | loading | empty | error | unsupported | ready
            let welcomeNote = "";
            let lib = null;
            let ps = null; // the player as this app sees it (zapli.music's state)
            let pendingSeek = null; // a place picked while the player holds another app's queue
            let skipDir = 0,
                skipAt = 0;
            let loadProgress = { n: 0, total: 0 };
            const lists = {}; // list id → track ids, for playing a list from a tapped row
            let tab = "songs";
            const tabScroll = { songs: 0, albums: 0, artists: 0 };
            let subKey = "";
            const has = (f) => {
                try {
                    return !!(Z && Z.supports(f));
                } catch {
                    return false;
                }
            };

            const el = {
                lib: $("#lib"),
                libBody: $("#libBody"),
                tabs: $("#tabs"),
                tabbar: $("#tabbar"),
                sub: $("#sub"),
                mini: $("#mini"),
                now: $("#now"),
                queue: $("#queue"),
                sheet: $("#sheet"),
                toast: $("#toast"),
                seek: $("#seek"),
            };

            /* ---------- the library: songs sorted for people, albums and artists grouped ---------- */
            function sectionOf(title) {
                const s = String(title || "")
                    .trim()
                    .replace(/^[^\p{L}\p{N}]+/u, "");
                if (!s) return "#";
                if (lang === "sk" && /^ch/i.test(s)) return "Ch";
                const c = Array.from(s)[0].toLocaleUpperCase(lang);
                if (!/\p{L}/u.test(c)) return "#";
                const base = c.normalize("NFD")[0];
                return collator.compare(c, base) === 0 ? base : c;
            }
            function buildLibrary(raw) {
                const songs = raw.filter((x) => x && x.id && x.title).map((x) => ({ ...x }));
                const albums = new Map(),
                    artists = new Map();
                for (const s of songs) {
                    s.ar = s.artist || "";
                    s.al = s.album || "";
                    s.ak = s.albumId ? "a" + s.albumId : s.al ? "n" + s.al.toLowerCase() : "u";
                    s.rk = s.ar ? s.ar.toLowerCase() : "-";
                    s.sec = sectionOf(s.title);
                    s.q = fold(`${s.title} ${s.ar} ${s.al}`);
                    let a = albums.get(s.ak);
                    if (!a) albums.set(s.ak, (a = { key: s.ak, title: s.al, tracks: [], names: new Set(), year: 0 }));
                    a.tracks.push(s);
                    if (s.ar) a.names.add(s.ar);
                    if (s.year) a.year = Math.max(a.year, s.year);
                    let r = artists.get(s.rk);
                    if (!r) artists.set(s.rk, (r = { key: s.rk, name: s.ar, tracks: [], keys: new Set() }));
                    r.tracks.push(s);
                    r.keys.add(s.ak);
                }
                const byTitle = (a, b) =>
                    collator.compare(a.title, b.title) || collator.compare(a.ar, b.ar) || collator.compare(a.al, b.al);
                songs.sort(byTitle);
                for (const a of albums.values()) {
                    a.tracks.sort(
                        (x, y) =>
                            (x.disc || 1) - (y.disc || 1) ||
                            (x.track || 999) - (y.track || 999) ||
                            collator.compare(x.title, y.title),
                    );
                    a.artist = a.names.size === 1 ? [...a.names][0] : a.names.size > 1 ? null : "";
                    a.duration = a.tracks.reduce((n, x) => n + (x.duration || 0), 0);
                    a.discs = new Set(a.tracks.map((x) => x.disc || 1)).size;
                    a.q = fold(`${a.title} ${a.artist || ""}`);
                }
                const albumList = [...albums.values()].sort(
                    (a, b) =>
                        !a.title - !b.title ||
                        collator.compare(a.title, b.title) ||
                        collator.compare(a.artist || "", b.artist || ""),
                );
                for (const r of artists.values()) {
                    r.tracks.sort(byTitle);
                    r.albums = [...r.keys]
                        .map((k) => albums.get(k))
                        .sort((a, b) => (b.year || 0) - (a.year || 0) || collator.compare(a.title, b.title));
                    r.q = fold(r.name);
                }
                const artistList = [...artists.values()].sort(
                    (a, b) => !a.name - !b.name || collator.compare(a.name, b.name),
                );
                lib = {
                    songs,
                    byId: new Map(songs.map((s) => [s.id, s])),
                    albums: albumList,
                    albumByKey: albums,
                    artists: artistList,
                    artistByKey: artists,
                };
            }
            const albumTitle = (a) => a.title || t("unknownAlbum");
            const albumArtist = (a) => (a.artist === null ? t("various") : a.artist || t("unknownArtist"));
            const artistName = (r) => r.name || t("unknownArtist");
            const songArtist = (s) => s.ar || t("unknownArtist");
            const artFor = (key) => art(key, DEMO_SEEDS.get(key));

            let loading = false,
                loadAgain = false;
            // Reads every page of the phone's songs. A changed version halfway means the songs changed: start again.
            async function loadLibrary(quiet) {
                if (loading) {
                    loadAgain = true;
                    return;
                }
                loading = true;
                const cached = store.get(CACHE_KEY);
                if (!lib && cached && Array.isArray(cached.tracks) && cached.tracks.length) {
                    buildLibrary(cached.tracks);
                    setAppState("ready");
                    if (ps) applyState(ps, true);
                } else if (!lib && !quiet) {
                    loadProgress = { n: 0, total: 0 };
                    setAppState("loading");
                }
                try {
                    let all = [],
                        offset = 0,
                        version = null,
                        restarts = 0,
                        same = false;
                    for (;;) {
                        const page = await M.tracks({ offset, limit: 500 });
                        if (offset === 0 && lib && cached && page.version === cached.version) {
                            same = true;
                            break;
                        }
                        if (version !== null && page.version !== version) {
                            if (++restarts > 3) throw zerr("INTERNAL");
                            all = [];
                            offset = 0;
                            version = null;
                            continue;
                        }
                        version = page.version;
                        all = all.concat(page.tracks || []);
                        offset += (page.tracks || []).length;
                        if (appState === "loading") {
                            loadProgress = { n: offset, total: page.total };
                            paintLoading();
                        }
                        if (offset >= page.total || !(page.tracks || []).length) break;
                    }
                    if (!same) {
                        const where = el.lib.scrollTop;
                        buildLibrary(all);
                        if (all.length && JSON.stringify(all).length < 4000000)
                            store.set(CACHE_KEY, { version, tracks: all });
                        else store.del(CACHE_KEY);
                        if (!all.length) setAppState("empty");
                        else {
                            const was = appState;
                            appState = "ready";
                            subKey = "";
                            render(true);
                            if (was === "ready") el.lib.scrollTop = where;
                        }
                        if (ps) applyState(ps, true);
                    }
                } catch (e) {
                    if (e && (e.code === "PERMISSION_DENIED" || e.code === "OS_DENIED")) checkAccess(true);
                    else if (!lib) setAppState("error");
                } finally {
                    loading = false;
                    if (loadAgain) {
                        loadAgain = false;
                        loadLibrary(true);
                    }
                }
            }

            /* ---------- covers: fetched from Zapli a few at a time (it allows 20 a second), newest first ---------- */
            const coverCache = new Map();
            const coverJobs = [];
            let coverBusy = 0,
                coverPauseUntil = 0;
            const coverStamps = [];
            function coverUrl(song, size) {
                const key = (song.albumId ? "a" + song.albumId : "t" + song.id) + "@" + size;
                let p = coverCache.get(key);
                if (!p) {
                    p = new Promise((resolve) => coverJobs.push({ id: song.id, size, resolve }));
                    coverCache.set(key, p);
                    pumpCovers();
                }
                return p;
            }
            function pumpCovers() {
                while (coverBusy < 4 && coverJobs.length) {
                    const now = performance.now();
                    while (coverStamps.length && now - coverStamps[0] > 1000) coverStamps.shift();
                    const wait = Math.max(
                        coverPauseUntil - now,
                        coverStamps.length >= 14 ? 1010 - (now - coverStamps[0]) : 0,
                    );
                    if (wait > 0) {
                        setTimeout(pumpCovers, wait);
                        return;
                    }
                    const job = coverJobs.pop();
                    coverBusy++;
                    coverStamps.push(now);
                    M.cover(job.id, { size: job.size })
                        .then(
                            (blob) => job.resolve(blob ? URL.createObjectURL(blob) : null),
                            (e) => {
                                if (e && e.code === "RATE_LIMITED") {
                                    coverPauseUntil = performance.now() + 1200;
                                    coverJobs.push(job);
                                } else job.resolve(null);
                            },
                        )
                        .finally(() => {
                            coverBusy--;
                            pumpCovers();
                        });
                }
            }
            const io =
                "IntersectionObserver" in window
                    ? new IntersectionObserver(
                          (entries) => {
                              for (const e of entries)
                                  if (e.isIntersecting) {
                                      io.unobserve(e.target);
                                      loadArt(e.target);
                                  }
                          },
                          { rootMargin: "500px 0px" },
                      )
                    : null;
            function observeArts(root) {
                for (const a of $$(".art[data-cv]:not([data-seen])", root)) {
                    a.dataset.seen = "1";
                    if (io) io.observe(a);
                    else loadArt(a);
                }
            }
            function loadArt(node) {
                const song = lib && lib.byId.get(node.dataset.cv);
                if (!song) return;
                coverUrl(song, node.classList.contains("xl") ? 512 : 256).then((url) => paintArt(node, url));
            }
            function paintArt(node, url, onHues) {
                if (!url) {
                    if (!DEMO) node.classList.add("nocover");
                    return;
                }
                const img = new Image();
                img.alt = "";
                img.decoding = "async";
                img.addEventListener("load", () => {
                    img.classList.add("on");
                    if (onHues) onHues(huesOf(img));
                });
                img.src = url;
                node.append(img);
            }
            // The cover's main colours: hue histogram of a 24 × 24 copy, weighted by colourfulness.
            const huesCache = new Map();
            function huesOf(img) {
                const key = img.src;
                if (huesCache.has(key)) return huesCache.get(key);
                let out = null;
                try {
                    const c = document.createElement("canvas");
                    c.width = c.height = 24;
                    const g = c.getContext("2d", { willReadFrequently: true });
                    g.drawImage(img, 0, 0, 24, 24);
                    const d = g.getImageData(0, 0, 24, 24).data;
                    const bins = new Float64Array(24);
                    let wsum = 0,
                        ssum = 0;
                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i] / 255,
                            gr = d[i + 1] / 255,
                            b = d[i + 2] / 255;
                        const mx = Math.max(r, gr, b),
                            mn = Math.min(r, gr, b),
                            l = (mx + mn) / 2,
                            dd = mx - mn;
                        if (dd < 0.04) continue;
                        const sat = dd / (1 - Math.abs(2 * l - 1));
                        let h = mx === r ? ((gr - b) / dd) % 6 : mx === gr ? (b - r) / dd + 2 : (r - gr) / dd + 4;
                        h = (h * 60 + 360) % 360;
                        const w = sat * Math.max(0, 1 - Math.abs(l - 0.5) * 1.7);
                        if (w <= 0) continue;
                        bins[Math.floor(h / 15) % 24] += w;
                        wsum += w;
                        ssum += sat * w;
                    }
                    if (wsum > 20) {
                        const sm = bins.map((v, i) => v * 2 + bins[(i + 23) % 24] + bins[(i + 1) % 24]);
                        let a = 0;
                        for (let i = 1; i < 24; i++) if (sm[i] > sm[a]) a = i;
                        let b = -1;
                        for (let i = 0; i < 24; i++) {
                            const dist = Math.min(Math.abs(i - a), 24 - Math.abs(i - a));
                            if (dist >= 3 && sm[i] > 0.25 * sm[a] && (b < 0 || sm[i] > sm[b])) b = i;
                        }
                        const h1 = a * 15 + 7;
                        out = { h1, h2: b < 0 ? (h1 + 35) % 360 : b * 15 + 7, s: ssum / wsum };
                    }
                } catch {
                    out = null;
                }
                huesCache.set(key, out);
                return out;
            }
            function tintVars(hues) {
                const dark = darkMode();
                if (!hues)
                    return dark
                        ? ["hsl(300 8% 20%)", "hsl(300 8% 9%)", "hsl(322 72% 80%)"]
                        : ["hsl(310 14% 92%)", "hsl(310 10% 82%)", "hsl(325 62% 32%)"];
                const s = Math.round(Math.min(58, Math.max(22, hues.s * 100)));
                return dark
                    ? [`hsl(${hues.h1} ${s}% 24%)`, `hsl(${hues.h2} ${s}% 10%)`, `hsl(${hues.h1} 82% 78%)`]
                    : [`hsl(${hues.h1} ${s}% 89%)`, `hsl(${hues.h2} ${s}% 78%)`, `hsl(${hues.h1} 72% 29%)`];
            }
            let lastHues = null;
            function tintNow(hues) {
                lastHues = hues;
                const [a, b, c] = tintVars(hues);
                el.now.style.setProperty("--np1", a);
                el.now.style.setProperty("--np2", b);
                el.now.style.setProperty("--npa", c);
            }

            /* ---------- pieces of the lists ---------- */
            function artHtml(song, cls) {
                const a = artFor(song.ak || song.id);
                return `<span class="art ${cls}" data-cv="${esc(song.id)}" style="${a.style}">${MARK}</span>`;
            }
            function curId() {
                return ps && ps.queue && ps.queue.length ? ps.track || ps.queue[ps.index || 0] : null;
            }
            function songRow(s, l, i, opts = {}) {
                const lead = opts.num
                    ? `<span class="num" aria-hidden="true">${s.track ? esc(s.track) : i + 1}</span>`
                    : artHtml(s, "sm");
                const sub = opts.noArtist
                    ? s.duration
                        ? clock(s.duration)
                        : ""
                    : songArtist(s) + (opts.album && s.al ? ` · ${s.al}` : "");
                const dur = opts.noArtist || !s.duration ? "" : `<span class="dur">${clock(s.duration)}</span>`;
                const cur = curId() === s.id ? " cur" : "";
                return `<li><button class="row${cur}" data-act="play" data-l="${esc(l)}" data-i="${i}" data-id="${esc(s.id)}">${lead}<span class="txt"><span class="t1">${esc(s.title)}</span><span class="t2">${esc(sub)}<span class="nowlbl vh">, ${esc(t("playingNow"))}</span></span></span>${dur}${EQ}</button></li>`;
            }
            function albumTile(a) {
                const first = a.tracks[0];
                const ar = artFor(a.key);
                return `<button class="tile" data-act="album" data-k="${esc(a.key)}"><span class="art" data-cv="${esc(first.id)}" style="${ar.style}">${MARK}</span><span class="t1">${esc(albumTitle(a))}</span><span class="t2">${esc(albumArtist(a))}</span></button>`;
            }
            function artistRow(r) {
                const first = (r.albums[0] && r.albums[0].tracks[0]) || r.tracks[0];
                const ar = artFor(first.ak);
                const meta = `${tn("songCount", r.tracks.length)} · ${tn("albumCount", r.albums.length)}`;
                return `<li><button class="arow" data-act="artist" data-k="${esc(r.key)}"><span class="art sm round" data-cv="${esc(first.id)}" style="${ar.style}">${MARK}</span><span class="txt"><span class="t1">${esc(artistName(r))}</span><span class="t2">${esc(meta)}</span></span>${icon("right", "chev")}</button></li>`;
            }
            function listActions(l, extra = "") {
                return `<div class="actions"><button class="pill primary" data-act="playAll" data-l="${esc(l)}">${icon("play")}<span>${esc(t("playAll"))}</span></button><button class="pill" data-act="shuffleAll" data-l="${esc(l)}">${icon("shuffle")}<span>${esc(t("shuffle"))}</span></button>${extra}</div>`;
            }

            /* ---------- the library screen ---------- */
            let chunkJob = 0;
            let songGroups = [];
            function renderTab(name) {
                cancelAnimationFrame(chunkJob);
                const body = el.libBody;
                body.setAttribute("role", "tabpanel");
                body.setAttribute("aria-labelledby", "tab-" + name);
                if (name === "albums") {
                    body.innerHTML = `<p class="count">${esc(tn("albumCount", lib.albums.length))}</p><div class="grid">${lib.albums.map(albumTile).join("")}</div>`;
                    observeArts(body);
                    return;
                }
                if (name === "artists") {
                    body.innerHTML = `<p class="count">${esc(tn("songCount", lib.songs.length))} · ${esc(tn("albumCount", lib.albums.length))}</p><ul class="rows">${lib.artists.map(artistRow).join("")}</ul>`;
                    observeArts(body);
                    return;
                }
                lists.songs = lib.songs.map((s) => s.id);
                songGroups = [];
                lib.songs.forEach((s, i) => {
                    const g = songGroups[songGroups.length - 1];
                    if (g && collator.compare(g.key, s.sec) === 0) g.end = i + 1;
                    else songGroups.push({ key: s.sec, start: i, end: i + 1 });
                });
                const az =
                    songGroups.length > 1
                        ? `<button class="pill" data-act="letters" aria-label="${esc(t("letters"))}">${esc(t("lettersShort"))}</button>`
                        : "";
                body.innerHTML = `${listActions("songs", az)}<p class="count">${esc(tn("songCount", lib.songs.length))}</p><div id="songSecs"></div>`;
                const host = $("#songSecs");
                let gi = 0;
                const step = () => {
                    let html = "",
                        n = 0;
                    while (gi < songGroups.length && n < 160) {
                        const g = songGroups[gi];
                        let rows = "";
                        for (let i = g.start; i < g.end; i++) rows += songRow(lib.songs[i], "songs", i);
                        html += `<section class="sec" style="contain-intrinsic-size:auto ${(g.end - g.start) * 80 + 56}px"><h2 class="sech" id="sec-${gi}"><button data-act="letters" aria-label="${esc(g.key)}. ${esc(t("letters"))}">${esc(g.key)}</button></h2><ul class="rows">${rows}</ul></section>`;
                        n += g.end - g.start;
                        gi++;
                    }
                    host.insertAdjacentHTML("beforeend", html);
                    observeArts(host);
                    if (gi < songGroups.length) chunkJob = requestAnimationFrame(step);
                };
                step();
                renderTab.flush = () => {
                    cancelAnimationFrame(chunkJob);
                    while (gi < songGroups.length) step();
                    cancelAnimationFrame(chunkJob);
                };
            }
            renderTab.flush = () => {};

            function showTab(name, keepScroll) {
                if (!keepScroll) tabScroll[tab] = el.lib.scrollTop;
                tab = name;
                for (const b of $$(".tab", el.tabs)) b.setAttribute("aria-selected", String(b.dataset.tab === name));
                renderTab(name);
                el.lib.scrollTop = keepScroll ? el.lib.scrollTop : tabScroll[name] || 0;
            }

            /* ---------- first run and the other states ---------- */
            function illo(kind) {
                const g = `<defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c94a8e"/><stop offset="1" stop-color="#6d1d4a"/></linearGradient></defs>`;
                const disc = (cls) =>
                    `<g class="${cls}"><circle cx="120" cy="92" r="70" fill="url(#ig)"/><circle cx="120" cy="92" r="56" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/><circle cx="120" cy="92" r="42" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/><circle cx="120" cy="92" r="20" fill="#ffc531"/><circle cx="120" cy="92" r="5" fill="#6d1d4a"/><path d="M84 52a52 52 0 0 1 30-14" stroke="#fff" stroke-opacity=".45" stroke-width="6" stroke-linecap="round" fill="none"/></g>`;
                const noteA = `<g class="float"><path fill="#ffc531" d="M196 30v34.5a9 9 0 1 0 6 8.5V44h12V30z"/></g>`;
                const noteB = `<g class="float b"><path fill="#e2333b" d="M42 112v26.5a8 8 0 1 0 5 7.5v-22h10v-12z"/></g>`;
                let body;
                if (kind === "welcome") body = disc("") + noteA + noteB;
                else if (kind === "loading") body = disc("spin") + noteA;
                else if (kind === "empty")
                    body = `<rect x="18" y="34" width="120" height="84" rx="10" fill="#8a7b88"/><rect x="26" y="42" width="104" height="66" rx="5" fill="#f3e9f0"/><rect x="56" y="122" width="44" height="10" rx="4" fill="#8a7b88"/><rect x="164" y="40" width="58" height="104" rx="12" fill="url(#ig)"/><rect x="171" y="52" width="44" height="76" rx="5" fill="#fff" fill-opacity=".9"/><path d="M138 128c14 0 16 14 30 14" stroke="#8a7b88" stroke-width="5" fill="none" stroke-linecap="round"/><g class="float"><path fill="#c94a8e" d="M72 56v26a8 8 0 1 0 5 7.4V66h11V56z"/></g><path fill="#c94a8e" d="M190 72v22a7 7 0 1 0 5 6.6V80h9v-8z"/>`;
                else if (kind === "error")
                    body =
                        disc("") +
                        `<circle cx="186" cy="44" r="22" fill="#e2333b"/><rect x="183" y="30" width="6" height="18" rx="3" fill="#fff"/><circle cx="186" cy="56" r="3.5" fill="#fff"/>`;

            function stateHtml(kind) {

                    case "osDenied":

            function paintLoading() {
                const bar = $("#loadBar"),
                    text = $("#loadText");

            function setAppState(s) {

            /* ---------- album, artist and search screens ---------- */
            function subHeader(title, extra = "") {

            }
            function renderAlbum(a) {

            }
            function renderArtist(r) {

            let searchTimer = 0;
            function renderSearch() {
                const q0 = ssGet("music.q");
                el.sub.innerHTML = `<header class="subtop scrolled"><button class="icon-btn" data-act="back" aria-label="${esc(t("back"))}">${icon("back")}</button><label class="searchbox">${icon("search")}<input type="search" id="q" placeholder="${esc(t("searchPh"))}" aria-label="${esc(t("search"))}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" /><button class="icon-btn" data-act="clearSearch" id="qClear" aria-label="${esc(t("clearSearch"))}" hidden>${icon("close")}</button></label></header><div id="results"></div>`;
                const input = $("#q");
                input.value = q0 || "";
                input.addEventListener("input", () => {
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(runSearch, 120);
                });
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") input.blur();
                });
                runSearch();
                setTimeout(() => input.focus(), 60);
            }
            function ssGet(k) {
                try {
                    return sessionStorage.getItem(k) || "";

                    return "";
                }
            }
            function ssSet(k, v) {
                try {
                    sessionStorage.setItem(k, v);
                } catch {
                    /* blocked */
                }
            }
            function runSearch() {
                const input = $("#q"),
                    out = $("#results");
                if (!input || !out) return;
                const raw = input.value.trim();
                ssSet("music.q", input.value);
                $("#qClear").hidden = !input.value;
                if (!raw) {
                    out.innerHTML = `<p class="hint">${esc(t("searchHint"))}</p>`;
                    return;
                }
                const terms = fold(raw).split(/\s+/).filter(Boolean);
                const hit = (q) => terms.every((w) => q.includes(w));
                const songs = lib.songs.filter((s) => hit(s.q)).slice(0, 60);
                const albums = lib.albums.filter((a) => hit(a.q)).slice(0, 24);
                const artists = lib.artists.filter((r) => r.name && hit(r.q)).slice(0, 24);
                if (!songs.length && !albums.length && !artists.length) {
                    out.innerHTML = `<p class="hint">${esc(t("noResults", { q: raw }))}</p>`;
                    return;
                }
                lists.search = songs.map((s) => s.id);
                let html = "";
                if (artists.length)
                    html += `<h2 class="rh">${esc(t("artists"))}</h2><ul class="rows">${artists.map(artistRow).join("")}</ul>`;
                if (albums.length)
                    html += `<h2 class="rh">${esc(t("albums"))}</h2><div class="strip">${albums.map(albumTile).join("")}</div>`;
                if (songs.length)
                    html += `<h2 class="rh">${esc(t("songs"))}</h2><ul class="rows">${songs.map((s, i) => songRow(s, "search", i, { album: true })).join("")}</ul>`;
                out.innerHTML = html;
